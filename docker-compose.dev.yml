  # Frontend with Vite HMR (consolidated Dockerfile — target: dev)
  # Primary way to run deepiri-web-frontend in normal platform workflow:
  #   docker compose -f docker-compose.dev.yml up -d auth-service api-gateway realtime-gateway frontend-dev
  # Linked to frontend PR: https://github.com/Team-Deepiri/deepiri-web-frontend/pull/111
  frontend-dev:
    build:
      context: ./deepiri-web-frontend
      dockerfile: Dockerfile
      target: dev
    image: deepiri-dev-frontend:latest
    pull_policy: never
    container_name: deepiri-frontend-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5173:5173"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      VITE_API_URL: http://localhost:${API_GATEWAY_PORT:-5100}/api
      VITE_API_GATEWAY_URL: http://localhost:${API_GATEWAY_PORT:-5100}
      VITE_REGISTRY_URL: ${VITE_REGISTRY_URL:-http://localhost:5003}
      VITE_REALTIME_GATEWAY_URL: http://localhost:${REALTIME_GATEWAY_PORT:-5008}
      VITE_SYNAPSE_URL: http://localhost:8002
      VITE_MLFLOW_URL: http://localhost:5500
      K8S_SERVICE_NAME: frontend-dev  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./deepiri-web-frontend:/app
      - /app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/usr/local/bin/node -e \"require('net').connect(5173,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      auth-service:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      realtime-gateway:
        condition: service_started
      synapse:
        condition: service_started
    networks:
      - deepiri-dev-network

