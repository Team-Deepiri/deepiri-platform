  #     # Cyrex Runtime Bridge
  #     CYREX_BASE_URL: http://cyrex:8000
  #     # Platform Services
  #     PLATFORM_API_URL: http://api-gateway:5100
  #     # ModelKit for contracts
  #     MODELKIT_PATH: /app/../deepiri-modelkit
  #   ports:
  #     - "8003:8003"
  #   volumes:
  #     - ./diri-cyrex/cyrex-agi/app:/app/app
  #     - cyrex_agi_cache:/app/.cache
  #   command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload --reload-dir /app/app
  #   healthcheck:
  #     test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health').read()"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   depends_on:
  #     - cyrex
  #     - redis
  #     - synapse
  #   networks:
  #     - deepiri-dev-network

  # MLflow for AI Experiment Tracking
  mlflow:
    build:
      context: ./ops/docker/mlflow
      dockerfile: Dockerfile
    image: deepiri-dev-mlflow:latest
    pull_policy: never
    container_name: deepiri-mlflow-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5500:5000"
    environment:
      # Backend Store (PostgreSQL)
      BACKEND_STORE_URI: postgresql://${POSTGRES_INTELLIGENCE_USER:-deepiri_intel}:${POSTGRES_INTELLIGENCE_PASSWORD:-deepiripassword}@postgres-intelligence:5432/${POSTGRES_INTELLIGENCE_DB:-intelligence_db}
      # Artifact Store (MinIO/S3)
      DEFAULT_ARTIFACT_ROOT: s3://mlflow-artifacts/
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      # MLflow Tracking URI (for modelkit integration)
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # ModelKit Integration
      MODELKIT_ENABLED: "true"
      MODELKIT_TRACKING_URI: http://mlflow:5000
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_INTELLIGENCE_USER:-deepiri_intel}:${POSTGRES_INTELLIGENCE_PASSWORD:-deepiripassword}@postgres-intelligence:5432/${POSTGRES_INTELLIGENCE_DB:-intelligence_db}
      --default-artifact-root s3://mlflow-artifacts/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres-intelligence
      - minio
    networks:
      - deepiri-dev-network

  # Deepiri Synapse - Central Streaming Service
  synapse:
    build:
      context: ./platform-services/shared/deepiri-synapse
      dockerfile: Dockerfile
      args:
        <<: *bedd-build-args
    container_name: deepiri-synapse-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "8002:8002"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      K8S_SERVICE_NAME: synapse  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - << 'EOF'\nimport urllib.request\ntry:\n    urllib.request.urlopen('http://localhost:8002/health', timeout=2)\n    exit(0)\nexcept Exception:\n    exit(1)\nEOF"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    networks:
      - deepiri-dev-network

  # Sugar Glider - Redis Streams transport sidecar
  sugar-glider:
    build:
      context: ./platform-services/shared/deepiri-sugar-glider
      dockerfile: Dockerfile
    image: deepiri-dev-sugar-glider:latest
    pull_policy: never
    container_name: deepiri-sugar-glider-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "8081:8081"
      - "50051:50051"
    environment:
      SIDECAR_SERVICE_NAME: deepiri-platform
      SIDECAR_REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      SIDECAR_LISTEN_ADDR: tcp://0.0.0.0:8081
      SIDECAR_GRPC_ADDR: tcp://0.0.0.0:50051
      # Allowlist for Cyrex AGI + Helox + LIS buses. Sugar Glider uses
      # XGROUP CREATE MKSTREAM on subscribe, so missing streams are created
      # lazily and do not abort sidecar startup.
      SIDECAR_PUBLISH_STREAMS: platform-events,inference-events,model-events,training-events,training-jobs,agi-decisions,pipeline.helox-training.raw,pipeline.helox-training.structured,pipeline.pressure.events,pipeline.artifact.invalidation,pipeline.splice.events,pipeline.dead-letter,pipeline.metrics,document.vectorize,document.training,document.structured,document.artifacts
      SIDECAR_CONSUME_STREAMS: platform-events,inference-events,model-events,training-events,training-jobs,agi-decisions,pipeline.helox-training.raw,pipeline.helox-training.structured,pipeline.pressure.events,pipeline.artifact.invalidation,pipeline.splice.events,pipeline.dead-letter,pipeline.metrics,document.vectorize,document.training,document.structured,document.artifacts
      SIDECAR_MAX_STREAM_LEN: "10000"
      SIDECAR_WAL_DIR: /data/synapse-wal
      SIDECAR_WAL_REPLAY_BATCH: "100"
      SIDECAR_WAL_REPLAY_INTERVAL_MS: "2000"
      SIDECAR_DLQ_MAX_RETRIES: "3"
      SIDECAR_DLQ_MIN_IDLE_MS: "30000"
      SIDECAR_DLQ_SCAN_INTERVAL_MS: "5000"
    volumes:
      - sugar_glider_dev_wal:/data/synapse-wal
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "/app/sidecar", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deepiri-dev-network

