name: deepiri-dev

# IMPORTANT: Set DOCKER_BUILDKIT=1 before building to enable layer caching
# This prevents 50GB+ of dangling images on every build

x-build-args: &build-args
  # Use BuildKit for better caching and no dangling images
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

# Published Bedd image (never pin a local retag like deepiri-bedd:local).
# Override only for offline emergency: BEDD_IMAGE=deepiri-bedd:local
# Requires ghcr.io pull access (docker login ghcr.io with read:packages).
x-bedd-build-args: &bedd-build-args
  BEDD_IMAGE: ${BEDD_IMAGE:-ghcr.io/team-deepiri/bedd:0.8}

# Minimal logging - logs are automatically cleared and not saved
x-logging: &minimal-logging
  driver: "local"
  options:
    max-size: "1m"      # Only 1MB per file
    max-file: "1"       # Only 1 file (no rotation backup)
    compress: "false"   # No compression (faster cleanup)

services:
  # PostgreSQL Database - Auth
  postgres-auth:
    image: postgres:16-alpine
    container_name: deepiri-postgres-auth-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_AUTH_USER:-deepiri_auth}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-deepiripassword}
      POSTGRES_DB: ${POSTGRES_AUTH_DB:-auth_db}
    volumes:
      - postgres_auth_dev_data:/var/lib/postgresql/data
      - ./scripts/database/postgres-init-auth.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - deepiri-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER:-deepiri_auth} -d ${POSTGRES_AUTH_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL Database - Core
  postgres-core:
    image: postgres:16-alpine
    container_name: deepiri-postgres-core-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_CORE_USER:-deepiri}
      POSTGRES_PASSWORD: ${POSTGRES_CORE_PASSWORD:-deepiripassword}
      POSTGRES_DB: ${POSTGRES_CORE_DB:-deepiri}
    volumes:
      - postgres_core_dev_data:/var/lib/postgresql/data
      - ./scripts/database/postgres-init-core.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - deepiri-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CORE_USER:-deepiri} -d ${POSTGRES_CORE_DB:-deepiri}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL Database - Cyrex
  postgres-cyrex:
    image: postgres:16-alpine
    container_name: deepiri-postgres-cyrex-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_CYREX_USER:-deepiri_cyrex}
      POSTGRES_PASSWORD: ${POSTGRES_CYREX_PASSWORD:-deepiripassword}
      POSTGRES_DB: ${POSTGRES_CYREX_DB:-cyrex_db}
    volumes:
      - postgres_cyrex_dev_data:/var/lib/postgresql/data
      - ./scripts/database/postgres-init-cyrex.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - deepiri-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CYREX_USER:-deepiri_cyrex} -d ${POSTGRES_CYREX_DB:-cyrex_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL Database - Intelligence (includes MLflow)
  postgres-intelligence:
    image: postgres:16-alpine
    container_name: deepiri-postgres-intelligence-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_INTELLIGENCE_USER:-deepiri_intel}
      POSTGRES_PASSWORD: ${POSTGRES_INTELLIGENCE_PASSWORD:-deepiripassword}
      POSTGRES_DB: ${POSTGRES_INTELLIGENCE_DB:-intelligence_db}
    volumes:
      - postgres_intelligence_dev_data:/var/lib/postgresql/data
      - ./scripts/database/postgres-init-intelligence.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - deepiri-dev-network
    depends_on:
      - postgres-auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_INTELLIGENCE_USER:-deepiri_intel} -d ${POSTGRES_INTELLIGENCE_DB:-intelligence_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # pgAdmin - Database Admin UI (optional, can be commented out for production)
  pgadmin:
    build:
      context: ./ops/docker/pgadmin
      dockerfile: Dockerfile
    container_name: deepiri-pgadmin-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@deepiri.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    healthcheck:
      # Use python to check if pgAdmin is responding (more reliable than curl)
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:80').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s  # pgAdmin can take 30-60s to initialize on first boot
    depends_on:
      - postgres-core
    networks:
      - deepiri-dev-network

  # Adminer - Lightweight Database Viewer (for quick inspection)
  adminer:
    image: adminer:latest
    container_name: deepiri-adminer-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-core
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      - postgres-core
    networks:
      - deepiri-dev-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: deepiri-redis-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "6380:6379"  # Using 6380 to avoid conflict with system Redis on 6379
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deepiri-dev-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: deepiri-kafka-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "Mvfv23irSXm93djf5t5WwA"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - deepiri-dev-network

  # InfluxDB for Time-Series Analytics
  influxdb:
    image: influxdb:2.7
    container_name: deepiri-influxdb-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-adminpassword}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-deepiri}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-analytics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-your-influxdb-token}
    volumes:
      - influxdb_dev_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - deepiri-dev-network

  # etcd service for Milvus metadata
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: deepiri-etcd-dev
    restart: unless-stopped
    logging: *minimal-logging
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd_dev_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - deepiri-dev-network

  # MinIO service for Milvus object storage
  # Updated to latest version (2024) with proper parity settings for data redundancy
  minio:
    image: minio/minio:latest
    container_name: deepiri-minio-dev
    restart: unless-stopped
    logging: *minimal-logging
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_dev_data:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    networks:
      - deepiri-dev-network

  # Milvus Vector Database for RAG (needs MinIO and etcd services)
  milvus:
    image: milvusdb/milvus:v2.3.0
    container_name: deepiri-milvus-dev
    restart: unless-stopped
    logging: *minimal-logging
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Reduce log verbosity - set to WARN to suppress INFO level noise
      COMMON_LOG_LEVEL: warn
    volumes:
      - milvus_dev_data:/var/lib/milvus
    healthcheck:
      # Check health endpoint - waits for all components (including rootcoord) to be ready
      # Increased start_period to give rootcoord time to start before other components try to connect
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s  # Increased to give rootcoord time to start first
    depends_on:
      - etcd
      - minio
    networks:
      - deepiri-dev-network

  # API Gateway - Routes requests to all microservices
  # Legacy backend monolith is retired from team workflows;
  # api-gateway is the backend entrypoint for local dev.
  api-gateway:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-api-gateway/Dockerfile
    image: deepiri-dev-api-gateway:latest
    pull_policy: never
    container_name: deepiri-api-gateway-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "${API_GATEWAY_PORT:-5100}:5000"  # Using 5100 externally to avoid conflict with macOS AirPlay on port 5000
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      PORT: 5000
      DB_HOST: postgres-core
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_CORE_DB:-deepiri}
      DB_USER: ${POSTGRES_CORE_USER:-deepiri}
      DB_PASSWORD: ${POSTGRES_CORE_PASSWORD:-deepiripassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379
      TRUSS_URL: http://truss:5002
      REGISTRY_URL: http://registry:5003
      TELEMETRY_URL: http://telemetry:5004
      MESSAGING_SERVICE_URL: http://messaging-service:5009
      JOBS_URL: http://jobs:5007
      EXTERNAL_BRIDGE_SERVICE_URL: http://external-bridge-service:5006
      REALTIME_GATEWAY_URL: http://realtime-gateway:5008
      LANGUAGE_INTELLIGENCE_SERVICE_URL: http://language-intelligence-service:5010
      SYNAPSE_URL: http://synapse:8002
      JWT_SECRET: ${JWT_SECRET:-deepiri-local-dev-jwt-key-for-dev-only-x9z}
      K8S_SERVICE_NAME: api-gateway  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/backend/deepiri-api-gateway/src:/app/src
      - ./platform-services/backend/deepiri-api-gateway/tsconfig.json:/app/tsconfig.json
    command: node dist/server.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - auth-service
      - truss
      - registry
      - telemetry
      - jobs
      - realtime-gateway
      - language-intelligence-service
      - messaging-service
      - synapse
      # cyrex dependency removed - only needed by AI/ML team
      # external-bridge-service dependency removed - only needed by Backend Team
    networks:
      - deepiri-dev-network

  # Auth Service
  auth-service:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-auth-service/Dockerfile
    image: deepiri-dev-auth-service:latest
    pull_policy: never
    container_name: deepiri-auth-service-dev
    restart: unless-stopped
    logging: *minimal-logging
    user: root
    ports:
      - "5001:5001"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_AUTH_USER:-deepiri_auth}:${POSTGRES_AUTH_PASSWORD:-deepiripassword}@postgres-auth:5432/${POSTGRES_AUTH_DB:-auth_db}
      SYNAPSE_URL: http://synapse:8002
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET:-deepiri-local-dev-jwt-key-for-dev-only-x9z}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-deepiri-local-dev-internal-key-for-dev-x9z}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      K8S_SERVICE_NAME: auth-service  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
    command: sh -c "(if [ -f /usr/local/bin/prisma-baseline.sh ]; then /usr/local/bin/prisma-baseline.sh; else echo '[Prisma Baseline] Script not found, skipping baseline (rebuild image to enable)'; npx prisma migrate deploy || true; fi) && npx prisma generate && npm run dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres-auth:
        condition: service_healthy
      influxdb:
        condition: service_started
      synapse:
        condition: service_started
    networks:
      - deepiri-dev-network

  # Workflow Orchestrator Service
  truss:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-truss/Dockerfile
    image: deepiri-dev-truss:latest
    pull_policy: never
    container_name: deepiri-truss-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5002:5002"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      PORT: 5002
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri}:${POSTGRES_CORE_PASSWORD:-deepiripassword}@postgres-core:5432/${POSTGRES_CORE_DB:-deepiri}
      PRISMA_CLI_BINARY_TARGETS: "debian-openssl-3.0.x"
      SYNAPSE_URL: http://synapse:8002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379
      K8S_SERVICE_NAME: truss  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/backend/deepiri-truss/src:/app/src
      - ./platform-services/backend/deepiri-truss/tsconfig.json:/app/tsconfig.json
    command: node dist/server.js
    depends_on:
      postgres-core:
        condition: service_healthy
      synapse:
        condition: service_started
    networks:
      - deepiri-dev-network

  # Incentive Engine Service
  registry:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-registry/Dockerfile
    image: deepiri-dev-registry:latest
    pull_policy: never
    container_name: deepiri-registry-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5003:5003"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      PORT: 5003
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri}:${POSTGRES_CORE_PASSWORD:-deepiripassword}@postgres-core:5432/${POSTGRES_CORE_DB:-deepiri}
      SYNAPSE_URL: http://synapse:8002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379
      K8S_SERVICE_NAME: registry  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/backend/deepiri-registry/src:/app/src
      - ./platform-services/backend/deepiri-registry/tsconfig.json:/app/tsconfig.json
    command: node dist/server.js
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_started
      synapse:
        condition: service_started
    networks:
      - deepiri-dev-network

  # Decision Intelligence Service
  telemetry:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-telemetry/Dockerfile
    image: deepiri-dev-telemetry:latest
    pull_policy: never
    container_name: deepiri-telemetry-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5004:5004"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      PORT: 5004
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri}:${POSTGRES_CORE_PASSWORD:-deepiripassword}@postgres-core:5432/${POSTGRES_CORE_DB:-deepiri}
      SYNAPSE_URL: http://synapse:8002
      K8S_SERVICE_NAME: telemetry  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/backend/deepiri-telemetry/src:/app/src
      - ./platform-services/backend/deepiri-telemetry/tsconfig.json:/app/tsconfig.json
    command: node dist/server.js
    depends_on:
      - postgres-core
      - influxdb
      - synapse
    networks:
      - deepiri-dev-network

  # External Bridge Service
  external-bridge-service:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-external-bridge-service/Dockerfile
    image: deepiri-dev-external-bridge-service:latest
    pull_policy: never
    container_name: deepiri-external-bridge-service-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5006:5006"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      PORT: 5006
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri}:${POSTGRES_CORE_PASSWORD:-deepiripassword}@postgres-core:5432/${POSTGRES_CORE_DB:-deepiri}
      SYNAPSE_URL: http://synapse:8002
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      EXTERNAL_BRIDGE_BASE_URL: ${EXTERNAL_BRIDGE_BASE_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      KAFKA_BROKERS: kafka:9092
      K8S_SERVICE_NAME: external-bridge-service  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/backend/deepiri-external-bridge-service/src:/app/src
      - ./platform-services/backend/deepiri-external-bridge-service/tsconfig.json:/app/tsconfig.json
    command: node dist/server.js
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres-core:
        condition: service_healthy
      synapse:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - deepiri-dev-network

  # Adaptive Experience Engine Service
  jobs:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-jobs/Dockerfile
    image: deepiri-dev-jobs:latest
    pull_policy: never
    container_name: deepiri-jobs-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5007:5007"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      PORT: 5007
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri}:${POSTGRES_CORE_PASSWORD:-deepiripassword}@postgres-core:5432/${POSTGRES_CORE_DB:-deepiri}
      SYNAPSE_URL: http://synapse:8002
      K8S_SERVICE_NAME: jobs  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/backend/deepiri-jobs/src:/app/src
      - ./platform-services/backend/deepiri-jobs/tsconfig.json:/app/tsconfig.json
    command: node dist/server.js
    depends_on:
      - postgres-core
      - synapse
      # cyrex dependency removed - only needed by AI/ML team
    networks:
      - deepiri-dev-network

  # Language Intelligence Service
  language-intelligence-service:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-language-intelligence-service/Dockerfile
      args:
        <<: *bedd-build-args
    image: deepiri-dev-language-intelligence-service:latest
    pull_policy: never
    container_name: deepiri-language-intelligence-service-dev
    restart: unless-stopped
    logging: *minimal-logging
    user: root
    # Port exposed for development only
    # In production: Remove this port mapping - only access through API Gateway
    ports:
      - "5009:5003"
    environment:
      PORT: 5003
      DATABASE_URL: postgresql://${POSTGRES_INTELLIGENCE_USER:-deepiri_intel}:${POSTGRES_INTELLIGENCE_PASSWORD:-deepiripassword}@postgres-intelligence:5432/${POSTGRES_INTELLIGENCE_DB:-intelligence_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      STORAGE_PROVIDER: minio
      STORAGE_BUCKET: language-intelligence-documents
      STORAGE_REGION: us-east-1
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CYREX_BASE_URL: http://cyrex:8000
      CYREX_API_KEY: ${CYREX_API_KEY:-change-me}
      BEDD_SKILLS_DIR: /opt/bedd/skills
      BEDD_BUS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379
      BEDD_DLQ_STREAM: bedd.dlq
      # Prefer Sugar Glider for document.* publishes (same bus as Cyrex/Helox).
      SYNAPSE_TRANSPORT: ${SYNAPSE_TRANSPORT:-sidecar}
      SYNAPSE_SUGAR_GLIDER_URL: ${SYNAPSE_SUGAR_GLIDER_URL:-http://synapse-sidecar:8081}
      # AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-}  # Optional - set to enable auth
      K8S_SERVICE_NAME: language-intelligence-service
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/shared/deepiri-shared-utils:/shared-utils
      - ./platform-services/backend/deepiri-language-intelligence-service/src:/app/src
      - ./platform-services/backend/deepiri-language-intelligence-service/tsconfig.json:/app/tsconfig.json
      - /shared-utils/node_modules
    command: sh -c "cd /shared-utils && rm -rf node_modules/.caniuse-lite* 2>/dev/null || true && npm cache clean --force && npm install --legacy-peer-deps && npm run build && cd /app && (if [ -f /usr/local/bin/prisma-baseline.sh ]; then /usr/local/bin/prisma-baseline.sh; else echo '[Prisma Baseline] Script not found, skipping baseline (rebuild image to enable)'; npx prisma migrate deploy || true; fi) && npx prisma generate && npm cache clean --force && npm install --legacy-peer-deps && npm install --legacy-peer-deps socket.io && npm install --legacy-peer-deps file:/shared-utils && npm run dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postgres-intelligence:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      cyrex:
        condition: service_started
      auth-service:
        condition: service_started
      synapse:
        condition: service_started
    networks:
      - deepiri-dev-network

  # Messaging Service
  messaging-service:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-messaging-service/Dockerfile
    image: deepiri-dev-messaging-service:latest
    pull_policy: never
    container_name: deepiri-messaging-service-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5010:5010"
    environment:
      PORT: 5010
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri}:${POSTGRES_CORE_PASSWORD:-deepiripassword}@postgres-core:5432/${POSTGRES_CORE_DB:-deepiri}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      CYREX_URL: http://cyrex:8000
      CYREX_API_KEY: ${CYREX_API_KEY:-change-me}
      REALTIME_GATEWAY_URL: http://realtime-gateway:5008
      K8S_SERVICE_NAME: messaging-service
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/shared/deepiri-shared-utils:/shared-utils
      - ./platform-services/backend/deepiri-messaging-service/src:/app/src
      - ./platform-services/backend/deepiri-messaging-service/tsconfig.json:/app/tsconfig.json
      - /shared-utils/node_modules
    command: sh -c "cd /shared-utils && rm -rf node_modules/.caniuse-lite* 2>/dev/null || true && npm cache clean --force && npm install --legacy-peer-deps && npm run build && cd /app && (if [ -f /usr/local/bin/prisma-baseline.sh ]; then /usr/local/bin/prisma-baseline.sh; else echo '[Prisma Baseline] Script not found, skipping baseline (rebuild image to enable)'; npx prisma migrate deploy || true; fi) && npx prisma generate && npm cache clean --force && npm install --legacy-peer-deps && npm install --legacy-peer-deps file:/shared-utils && npm run dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - postgres-core
      - redis
      - cyrex
      - realtime-gateway
      - auth-service
      - synapse
    networks:
      - deepiri-dev-network

  # Realtime Gateway Service
  realtime-gateway:
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-realtime-gateway/Dockerfile
    image: deepiri-dev-realtime-gateway:latest
    pull_policy: never
    container_name: deepiri-realtime-gateway-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "5008:5008"
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      # Override or add docker-specific variables here if needed
      PORT: 5008
      SYNAPSE_URL: http://synapse:8002
      SYNAPSE_SUGAR_GLIDER_URL: ${SYNAPSE_SUGAR_GLIDER_URL:-http://sugar-glider:8081}
      SYNAPSE_SIDECAR_URL: ${SYNAPSE_SIDECAR_URL:-http://sugar-glider:8081}
      SYNAPSE_GRPC_ADDR: ${SYNAPSE_GRPC_ADDR:-sugar-glider:50051}
      STREAM_TRANSPORT: ${STREAM_TRANSPORT:-sugar-glider-grpc}
      STREAM_SHADOW_MODE: ${STREAM_SHADOW_MODE:-false}
      STREAM_CONSUMER_GROUP: ${STREAM_CONSUMER_GROUP:-realtime-gateway}
      STREAM_CONSUMER_NAME: ${STREAM_CONSUMER_NAME:-realtime-1}
      STREAM_SUBSCRIBE_BATCH_SIZE: ${STREAM_SUBSCRIBE_BATCH_SIZE:-128}
      STREAM_EVENT_MAX_IN_FLIGHT: ${STREAM_EVENT_MAX_IN_FLIGHT:-1024}
      STREAM_EVENT_RESUME_IN_FLIGHT: ${STREAM_EVENT_RESUME_IN_FLIGHT:-768}
      STREAM_ACK_BATCH_SIZE: ${STREAM_ACK_BATCH_SIZE:-256}
      STREAM_ACK_FLUSH_MS: ${STREAM_ACK_FLUSH_MS:-6}
      STREAM_ACK_FLUSH_CONCURRENCY: ${STREAM_ACK_FLUSH_CONCURRENCY:-8}
      STREAM_ACK_RETRY_MAX_ATTEMPTS: ${STREAM_ACK_RETRY_MAX_ATTEMPTS:-3}
      STREAM_ACK_RETRY_BASE_MS: ${STREAM_ACK_RETRY_BASE_MS:-25}
      STREAM_ACK_LOW_TRAFFIC_FLUSH_MS: ${STREAM_ACK_LOW_TRAFFIC_FLUSH_MS:-1}
      STREAM_ACK_LOW_TRAFFIC_GAP_MS: ${STREAM_ACK_LOW_TRAFFIC_GAP_MS:-16}
      STREAM_ACK_LOW_TRAFFIC_MAX_PENDING: ${STREAM_ACK_LOW_TRAFFIC_MAX_PENDING:-32}
      STREAM_LAZY_PAYLOAD_PARSE: ${STREAM_LAZY_PAYLOAD_PARSE:-true}
      STREAM_EXTRACT_USER_FROM_PAYLOAD: ${STREAM_EXTRACT_USER_FROM_PAYLOAD:-false}
      STREAM_LANE_RUNTIME_PROFILES_ENABLED: ${STREAM_LANE_RUNTIME_PROFILES_ENABLED:-false}
      STREAM_DIRECT_BROADCAST_FAST_PATH: ${STREAM_DIRECT_BROADCAST_FAST_PATH:-off}
      STREAM_DIRECT_BROADCAST_MIN_PAYLOAD_BYTES: ${STREAM_DIRECT_BROADCAST_MIN_PAYLOAD_BYTES:-0}
      SOCKET_IO_PARSER: ${SOCKET_IO_PARSER:-default}
      SOCKET_IO_DISCARD_INITIAL_REQUEST: ${SOCKET_IO_DISCARD_INITIAL_REQUEST:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      K8S_SERVICE_NAME: realtime-gateway  # Filter to only load this service's configmap
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./platform-services/backend/deepiri-realtime-gateway/src:/app/src
      - ./platform-services/backend/deepiri-realtime-gateway/tsconfig.json:/app/tsconfig.json
    command: node dist/server.js
    depends_on:
      - redis
      - synapse
    networks:
      - deepiri-dev-network

  # ════════════════════════════════════════════════════════════════════════
  # Ollama
  # ════════════════════════════════════════════════════════════════════════
  # Usage:
  #   docker compose up -d ollama
  #
  # The ollama image auto-detects GPU at runtime if the host has one.
  # For GPU acceleration (one-time host setup, if you have NVIDIA GPU):
  #   sudo nvidia-ctk runtime configure --runtime=docker --set-as-default
  #   sudo systemctl restart docker
  # ════════════════════════════════════════════════════════════════════════
  ollama:
    # Use custom Dockerfile with build-time model pre-pull
    # Models are downloaded during Docker build and baked into the image
    # This eliminates 1.2-3.3s first-request penalty from model loading
    # 
    # To disable pre-pull and use check-ollama-models.sh script instead:
    #   docker-compose build --build-arg PRE_PULL_MODELS=false ollama
    # 
    # To pre-pull specific models (space-separated):
    #   docker-compose build --build-arg MODELS="mistral:7b llama3:8b codellama:7b" ollama
    build:
      context: ./ops/docker/ollama
      dockerfile: Dockerfile
      args:
        PRE_PULL_MODELS: "true"  # Set to "false" to disable build-time pre-pull
        MODELS: "mistral:7b llama3:8b codellama:7b"  # Space-separated list of models to pre-pull
    # Fallback to public image if build context doesn't exist
    image: ollama/ollama:latest
    container_name: deepiri-ollama-dev
    restart: unless-stopped
    logging: *minimal-logging
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
    - ollama_dev_data:/root/.ollama
    - ./deepiri-ollama-utils:/opt/deepiri-ollama-utils
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      # Stock ollama/ollama has no curl; CLI proves the daemon is up (same as exovra-platform).
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    networks:
      - deepiri-dev-network

  # Python Agent API (AI Service)
  cyrex:
    build:
      context: .
      dockerfile: ./diri-cyrex/Dockerfile
      args:
        BUILD_TYPE: ${CYREX_BUILD_TYPE:-prebuilt}
        BASE_IMAGE: ${CYREX_BASE_IMAGE:-pytorch/pytorch:2.9.1-cuda12.8-cudnn9-runtime}
        DEVICE_TYPE: ${CYREX_DEVICE_TYPE:-auto}
        PYTORCH_VERSION: 2.9.1
        PYTHON_VERSION: 3.11
        # Using CUDA 12.8 base image for RTX 5080/5090 (sm_120) support
    image: deepiri-dev-cyrex:latest
    pull_policy: never
    container_name: deepiri-cyrex-dev
    restart: unless-stopped
    logging: *minimal-logging
    # Variables auto-loaded from ops/k8s/configmaps and secrets via entrypoint
    environment:
      K8S_SERVICE_NAME: cyrex  # Filter to only load this service's configmap
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      CORS_ORIGIN: http://localhost:5173
      CYREX_API_KEY: ${CYREX_API_KEY:-change-me}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      WANDB_API_KEY: ${WANDB_API_KEY}
      # Model Registry Configuration (for modelkit integration)
      MODEL_REGISTRY_TYPE: ${MODEL_REGISTRY_TYPE:-mlflow}
      MODEL_REGISTRY_PATH: /app/model_registry
      MODEL_CACHE_DIR: /app/models/cache
      S3_ENDPOINT_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-mlflow-artifacts}
      STAGING_MODEL_PATH: /app/models/staging
      PRODUCTION_MODEL_PATH: /app/models/production
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT:-us-east1-gcp}
      PINECONE_INDEX: ${PINECONE_INDEX:-deepiri}
      WEAVIATE_URL: ${WEAVIATE_URL}
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-deepiri}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-analytics}
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      # PostgreSQL Configuration
      POSTGRES_HOST: postgres-cyrex
      POSTGRES_PORT: 5434
      POSTGRES_DB: ${POSTGRES_CYREX_DB:-cyrex_db}
      POSTGRES_USER: ${POSTGRES_CYREX_USER:-deepiri_cyrex}
      POSTGRES_PASSWORD: ${POSTGRES_CYREX_PASSWORD:-deepiripassword}
      # Node Backend (API Gateway) Configuration
      NODE_BACKEND_URL: http://api-gateway:5000
      # Local LLM Configuration
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LOCAL_LLM_BACKEND: ${LOCAL_LLM_BACKEND:-ollama}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3:8b}
      HF_HOME: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence_transformers
      # Streaming Service Configuration
      SYNAPSE_URL: http://synapse:8002
      # Synapse transport (redis|sidecar). Default to sidecar in dev.
      SYNAPSE_TRANSPORT: ${SYNAPSE_TRANSPORT:-sidecar}
      SYNAPSE_SIDECAR_URL: ${SYNAPSE_SIDECAR_URL:-http://sugar-glider:8081}
      SYNAPSE_SIDECAR_TIMEOUT_SEC: ${SYNAPSE_SIDECAR_TIMEOUT_SEC:-5}
      SYNAPSE_SIDECAR_SENDER: ${SYNAPSE_SIDECAR_SENDER:-cyrex}
      SYNAPSE_CONSUMER_NAME: ${SYNAPSE_CONSUMER_NAME:-cyrex-1}
      SYNAPSE_MODEL_EVENTS_GROUP: ${SYNAPSE_MODEL_EVENTS_GROUP:-cyrex-runtime}
      SYNAPSE_SIDECAR_SUBSCRIBER_GROUP_SUFFIX: ${SYNAPSE_SIDECAR_SUBSCRIBER_GROUP_SUFFIX:-subscribers}
      # Override or add docker-specific variables here if needed
    ports:
      - "8000:8000"
    volumes:
      - ./ops/k8s/configmaps:/k8s-configmaps:ro
      - ./ops/k8s/load-k8s-env.sh:/usr/local/bin/load-k8s-env.sh:ro
      - ./ops/k8s/secrets:/k8s-secrets:ro
      - ./diri-cyrex/app:/app/app
      - ./diri-cyrex/train:/app/train
      - ./diri-cyrex/inference:/app/inference
      - ./diri-cyrex/tests:/app/tests
      - ./diri-cyrex/cyrex_watcher.py:/app/cyrex_watcher.py:ro
      - cyrex_cache:/app/.cache
    command: python /app/cyrex_watcher.py --watch-dir /app/app --app-module app.main:app --host 0.0.0.0 --port 8000
    # GPU support - automatically detects and uses available GPU
    # Priority: CUDA (NVIDIA) → MPS (Apple Silicon) → CPU
    # 
    # NVIDIA CUDA: Configured via deploy.resources below
    #   - Requires: NVIDIA Container Toolkit installed
    #   - Works on: Linux, WSL2, Windows with NVIDIA GPU
    #
    # Apple Silicon MPS: Automatically detected by PyTorch
    #   - Works natively on macOS (Docker Desktop on Mac)
    #   - No docker-compose config needed - PyTorch detects automatically
    #   - Note: Docker containers on Mac typically can't access GPU
    #   - For best MPS performance, run natively on macOS (not in Docker)
    #
    # CPU: Falls back gracefully if no GPU available
    deploy:
      resources:
        reservations:
          devices:
            # NVIDIA GPU support (Linux/WSL/Windows with NVIDIA GPU)
            - driver: nvidia
              count: all
              capabilities: [gpu]
            # Note: MPS (Apple Silicon) doesn't use docker device drivers
            # It's automatically detected by PyTorch when available on macOS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres-cyrex:
        condition: service_healthy
      influxdb:
        condition: service_started
      milvus:
        condition: service_started
      ollama:
        condition: service_started
      redis:
        condition: service_started
      synapse:
        condition: service_started
      mlflow:
        condition: service_started
    networks:
      - deepiri-dev-network

  cyrex-interface:
    image: node:20-alpine
    container_name: deepiri-cyrex-interface-dev
    restart: unless-stopped
    logging: *minimal-logging
    working_dir: /app
    environment:
      VITE_CYREX_BASE_URL: http://localhost:8000
      VITE_SYNAPSE_URL: http://localhost:8002
      VITE_PORT: 5175
    ports:
      - "5175:5175"
    volumes:
      - ./diri-cyrex/cyrex-interface:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5175}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/usr/local/bin/node -e \"require('net').connect(5175,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - cyrex
      - synapse
    networks:
      - deepiri-dev-network

  # Cyrex-AGI - Commented out for now
  # cyrex-agi:
  #   build:
  #     context: ./diri-cyrex/cyrex-agi
  #     dockerfile: Dockerfile
  #   image: deepiri-dev-cyrex-agi:latest
  #   pull_policy: never
  #   container_name: deepiri-cyrex-agi-dev
