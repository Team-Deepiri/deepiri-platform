name: deepiri

# Cloud / prod one-box compose.
# Target: cheap 8 GB VPS, non-AI platform services only.
#
# Secrets/env files are expected to live directly in:
#   ./ops/k8s/secrets/.env
#
# Heavy/off-by-default services are intentionally commented out per infra preference:
#   cyrex, cyrex-interface, ollama, mlflow, milvus, etcd, minio, kafka,
#   influxdb, pgadmin, adminer, deepiri-prismpipe.

x-logging: &minimal-logging
  driver: "local"
  options:
    max-size: "1m"
    max-file: "1"
    compress: "false"

x-env: &default-env
  env_file:
    - ./ops/k8s/secrets/.env

services:
  # Data
  #
  # Single Postgres 16 container hosting 3 logical databases (platform_auth,
  # platform_core, platform_intelligence), each with its own role, instead
  # of one container per tenant. Lower overhead on a cheap VPS, simpler
  # backups (one data dir, one pg_dumpall), still logically separated.
  # scripts/database/postgres-init-multi-db.sh creates the roles/databases
  # on first boot and applies each tenant's existing schema file inside its
  # own database.
  postgres:
    <<: *default-env
    image: postgres:16-alpine
    container_name: deepiri-postgres
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 1536m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepiri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-deepiri}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-platform_auth}
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-deepiri_auth}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}
      POSTGRES_CORE_DB: ${POSTGRES_CORE_DB:-platform_core}
      POSTGRES_CORE_USER: ${POSTGRES_CORE_USER:-deepiri_core}
      POSTGRES_CORE_PASSWORD: ${POSTGRES_CORE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}
      POSTGRES_INTELLIGENCE_DB: ${POSTGRES_INTELLIGENCE_DB:-platform_intelligence}
      POSTGRES_INTELLIGENCE_USER: ${POSTGRES_INTELLIGENCE_USER:-deepiri_intel}
      POSTGRES_INTELLIGENCE_PASSWORD: ${POSTGRES_INTELLIGENCE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/database/postgres-init-multi-db.sh:/docker-entrypoint-initdb.d/00-init-multi-db.sh:ro
      - ./scripts/database/postgres-init-auth.sql:/docker-entrypoint-initdb.d/schemas/auth.sql:ro
      - ./scripts/database/postgres-init-core.sql:/docker-entrypoint-initdb.d/schemas/core.sql:ro
      - ./scripts/database/postgres-init-intelligence.sql:/docker-entrypoint-initdb.d/schemas/intelligence.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepiri}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - deepiri-network

  redis:
    <<: *default-env
    image: redis:7.2-alpine
    container_name: deepiri-redis
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 384m
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deepiri-network

  # Edge / portal
  api-gateway:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-api-gateway/Dockerfile
    image: deepiri-api-gateway:prod
    container_name: deepiri-api-gateway
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 768m
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_CORE_DB:-platform_core}
      DB_USER: ${POSTGRES_CORE_USER:-deepiri_core}
      DB_PASSWORD: ${POSTGRES_CORE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:5001
      TRUSS_URL: http://truss:5002
      REGISTRY_URL: http://registry:5003
      TELEMETRY_URL: http://telemetry:5004
      EXTERNAL_BRIDGE_SERVICE_URL: ${EXTERNAL_BRIDGE_SERVICE_URL:-http://disabled-external-bridge:5006}
      JOBS_URL: http://jobs:5007
      REALTIME_GATEWAY_URL: http://realtime-gateway:5008
      MESSAGING_SERVICE_URL: http://messaging-service:5009
      LANGUAGE_INTELLIGENCE_SERVICE_URL: http://language-intelligence-service:5003
      CYREX_URL: ${CYREX_URL:-http://disabled-cyrex:8000}
      SYNAPSE_URL: http://synapse:8002
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
    depends_on:
      auth-service:
        condition: service_started
      truss:
        condition: service_started
      registry:
        condition: service_started
      telemetry:
        condition: service_started
      jobs:
        condition: service_started
      messaging-service:
        condition: service_started
      realtime-gateway:
        condition: service_started
      language-intelligence-service:
        condition: service_started
      synapse:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - deepiri-network

  frontend:
    <<: *default-env
    build:
      context: ./deepiri-web-frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    image: deepiri-frontend:prod
    container_name: deepiri-frontend
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 256m
    depends_on:
      - api-gateway
    networks:
      - deepiri-network

  nginx:
    <<: *default-env
    image: nginx:alpine
    container_name: deepiri-nginx
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/cloud-prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - api-gateway
      - realtime-gateway
    networks:
      - deepiri-network

  # Nightly full-cluster backup (all 3 logical databases + roles in one
  # pg_dumpall, via scripts/database/postgres-backup.sh) to a named volume.
  # That volume is still local disk — see pg-backup-offsite below for
  # actually getting copies off the box.
  pg-backup:
    image: postgres:16-alpine
    container_name: deepiri-pg-backup
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 256m
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-deepiri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./scripts/database/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
      - postgres_backups:/backups
    entrypoint: >
      /bin/bash -c "trap exit TERM; while :; do /usr/local/bin/postgres-backup.sh; sleep 24h & wait $${!}; done"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deepiri-network

  # Copies pg-backup's output to off-box, S3-compatible storage (S3/R2/B2/
  # Spaces/MinIO — anything speaking the S3 API) via rclone. A backup that
  # only lives on the same disk as the database it's backing up isn't a
  # real backup. Safe no-op until BACKUP_OFFSITE_ENABLED=true and a real
  # bucket/account are set — see scripts/database/postgres-backup-offsite-sync.sh.
  pg-backup-offsite:
    image: rclone/rclone:latest
    container_name: deepiri-pg-backup-offsite
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 128m
    environment:
      BACKUP_DIR: /backups
      BACKUP_OFFSITE_ENABLED: ${BACKUP_OFFSITE_ENABLED:-false}
      BACKUP_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-Other}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET:-}
      BACKUP_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      BACKUP_OFFSITE_REGION: ${BACKUP_OFFSITE_REGION:-}
      BACKUP_OFFSITE_ACCESS_KEY_ID: ${BACKUP_OFFSITE_ACCESS_KEY_ID:-}
      BACKUP_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_OFFSITE_SECRET_ACCESS_KEY:-}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-postgres-backups}
    volumes:
      - ./scripts/database/postgres-backup-offsite-sync.sh:/usr/local/bin/postgres-backup-offsite-sync.sh:ro
      - postgres_backups:/backups:ro
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do sh /usr/local/bin/postgres-backup-offsite-sync.sh; sleep 24h & wait $${!}; done"
    depends_on:
      - pg-backup
    networks:
      - deepiri-network

  # Issues/renews the real TLS cert (ops/nginx/init-letsencrypt.sh does the
  # one-time bootstrap; this loop just keeps it renewed after that). nginx
  # reads certs from the same certbot_conf volume but doesn't auto-reload on
  # renewal — see the crontab note init-letsencrypt.sh prints.
  certbot:
    image: certbot/certbot:latest
    container_name: deepiri-certbot
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 128m
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - deepiri-network

  # Platform domain services
  auth-service:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-auth-service/Dockerfile
    image: deepiri-auth-service:prod
    container_name: deepiri-auth-service
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_AUTH_USER:-deepiri_auth}:${POSTGRES_AUTH_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}@postgres:5432/${POSTGRES_AUTH_DB:-platform_auth}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SYNAPSE_URL: http://synapse:8002
    command: sh -c "if [ -f /usr/local/bin/prisma-baseline.sh ]; then /usr/local/bin/prisma-baseline.sh; else npx prisma migrate deploy || true; fi && node dist/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - deepiri-network

  truss:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-truss/Dockerfile
    image: deepiri-truss:prod
    container_name: deepiri-truss
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5002
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri_core}:${POSTGRES_CORE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}@postgres:5432/${POSTGRES_CORE_DB:-platform_core}
      JOBS_URL: http://jobs:5007
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SYNAPSE_URL: http://synapse:8002
    depends_on:
      postgres:
        condition: service_healthy
      jobs:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - deepiri-network

  registry:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-registry/Dockerfile
    image: deepiri-registry:prod
    container_name: deepiri-registry
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5003
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri_core}:${POSTGRES_CORE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}@postgres:5432/${POSTGRES_CORE_DB:-platform_core}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SYNAPSE_URL: http://synapse:8002
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deepiri-network

  telemetry:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-telemetry/Dockerfile
    image: deepiri-telemetry:prod
    container_name: deepiri-telemetry
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5004
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri_core}:${POSTGRES_CORE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}@postgres:5432/${POSTGRES_CORE_DB:-platform_core}
      JOBS_URL: http://jobs:5007
      REGISTRY_URL: http://registry:5003
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SYNAPSE_URL: http://synapse:8002
      INFLUXDB_URL: ${INFLUXDB_URL:-}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-deepiri}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-analytics}
    depends_on:
      postgres:
        condition: service_healthy
      jobs:
        condition: service_started
      registry:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - deepiri-network

  jobs:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-jobs/Dockerfile
    image: deepiri-jobs:prod
    container_name: deepiri-jobs
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5007
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri_core}:${POSTGRES_CORE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}@postgres:5432/${POSTGRES_CORE_DB:-platform_core}
      HELOX_URL: ${HELOX_URL:-}
      HELOX_API_KEY: ${HELOX_API_KEY:-}
      SYNAPSE_URL: http://synapse:8002
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deepiri-network

  language-intelligence-service:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-language-intelligence-service/Dockerfile
    image: deepiri-language-intelligence-service:prod
    container_name: deepiri-language-intelligence-service
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; NLP-heavy service, tune to actual box size.
    mem_limit: 1536m
    environment:
      NODE_ENV: production
      PORT: 5003
      DATABASE_URL: postgresql://${POSTGRES_INTELLIGENCE_USER:-deepiri_intel}:${POSTGRES_INTELLIGENCE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}@postgres:5432/${POSTGRES_INTELLIGENCE_DB:-platform_intelligence}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:?STORAGE_PROVIDER must be set}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?STORAGE_BUCKET must be set}
      STORAGE_REGION: ${STORAGE_REGION:?STORAGE_REGION must be set}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT must be set}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?STORAGE_ACCESS_KEY_ID must be set}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?STORAGE_SECRET_ACCESS_KEY must be set}
      CYREX_BASE_URL: ${CYREX_BASE_URL:-http://disabled-cyrex:8000}
      CYREX_API_KEY: ${CYREX_API_KEY:-}
      AUTH_ENABLED: ${LANGUAGE_INTELLIGENCE_AUTH_ENABLED:-false}
      SYNAPSE_TRANSPORT: ${SYNAPSE_TRANSPORT:-sidecar}
      SYNAPSE_SUGAR_GLIDER_URL: http://sugar-glider:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
      sugar-glider:
        condition: service_started
    networks:
      - deepiri-network

  messaging-service:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-messaging-service/Dockerfile
    image: deepiri-messaging-service:prod
    container_name: deepiri-messaging-service
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5009
      DATABASE_URL: postgresql://${POSTGRES_CORE_USER:-deepiri_core}:${POSTGRES_CORE_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}}@postgres:5432/${POSTGRES_CORE_DB:-platform_core}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      CYREX_URL: ${CYREX_URL:-http://disabled-cyrex:8000}
      CYREX_API_KEY: ${CYREX_API_KEY:-}
      REALTIME_GATEWAY_URL: http://realtime-gateway:5008
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-mailto:notifications@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      realtime-gateway:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - deepiri-network

  realtime-gateway:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-realtime-gateway/Dockerfile
    image: deepiri-realtime-gateway:prod
    container_name: deepiri-realtime-gateway
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5008
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SYNAPSE_URL: http://synapse:8002
      SYNAPSE_SUGAR_GLIDER_URL: http://sugar-glider:8081
      SYNAPSE_SIDECAR_URL: http://sugar-glider:8081
      SYNAPSE_GRPC_ADDR: sugar-glider:50051
      STREAM_TRANSPORT: ${STREAM_TRANSPORT:-sugar-glider-grpc}
      STREAM_CONSUMER_GROUP: ${STREAM_CONSUMER_GROUP:-realtime-gateway}
      STREAM_CONSUMER_NAME: ${STREAM_CONSUMER_NAME:-realtime-1}
    depends_on:
      redis:
        condition: service_healthy
      synapse:
        condition: service_started
      sugar-glider:
        condition: service_started
    networks:
      - deepiri-network

  synapse:
    <<: *default-env
    build:
      context: ./platform-services/shared/deepiri-synapse
      dockerfile: Dockerfile
    image: deepiri-synapse:prod
    container_name: deepiri-synapse
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 256m
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - deepiri-network

  sugar-glider:
    <<: *default-env
    build:
      context: ./platform-services/shared/deepiri-sugar-glider
      dockerfile: Dockerfile
    image: deepiri-sugar-glider:prod
    container_name: deepiri-sugar-glider
    restart: unless-stopped
    logging: *minimal-logging
    # Soft memory cap for the cheap one-box profile; tune to actual box size.
    mem_limit: 256m
    environment:
      SIDECAR_SERVICE_NAME: deepiri-platform
      SIDECAR_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      SIDECAR_LISTEN_ADDR: tcp://0.0.0.0:8081
      SIDECAR_GRPC_ADDR: tcp://0.0.0.0:50051
      SIDECAR_PUBLISH_STREAMS: platform-events,inference-events,model-events,training-events,training-jobs,agi-decisions,pipeline.helox-training.raw,pipeline.helox-training.structured,pipeline.pressure.events,pipeline.artifact.invalidation,pipeline.splice.events,pipeline.dead-letter,pipeline.metrics,document.vectorize,document.training,document.structured,document.artifacts
      SIDECAR_CONSUME_STREAMS: platform-events,inference-events,model-events,training-events,training-jobs,agi-decisions,pipeline.helox-training.raw,pipeline.helox-training.structured,pipeline.pressure.events,pipeline.artifact.invalidation,pipeline.splice.events,pipeline.dead-letter,pipeline.metrics,document.vectorize,document.training,document.structured,document.artifacts
      SIDECAR_MAX_STREAM_LEN: "10000"
      SIDECAR_WAL_DIR: /data/synapse-wal
    volumes:
      - sugar_glider_wal:/data/synapse-wal
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - deepiri-network

