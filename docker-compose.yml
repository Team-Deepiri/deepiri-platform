name: deepiri-platform

# Cloud portal — cheap VPS one-box compose.
# Internal portal only: auth, org, tools, Plaky, jobs. No Cyrex / LIS / AI runtime.
#
# Full local builder stack → docker-compose.control-plane.yml (deepiri-control-plane repo).
#
# Secrets: ./ops/k8s/secrets/.env

x-logging: &minimal-logging
  driver: "local"
  options:
    max-size: "1m"
    max-file: "1"
    compress: "false"

x-env: &default-env
  env_file:
    - ./ops/k8s/secrets/.env

services:
  postgres-platform:
    <<: *default-env
    image: postgres:16-alpine
    container_name: deepiri-postgres-platform
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 1536m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-platform}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-deepiri_platform}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
    volumes:
      - postgres_platform_data:/var/lib/postgresql/data
      - ./scripts/database/postgres-init-platform.sh:/docker-entrypoint-initdb.d/00-init-platform.sh:ro
      - ./scripts/database/postgres-init-platform.sql:/docker-entrypoint-initdb.d/schemas/platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - deepiri-network

  redis:
    <<: *default-env
    image: redis:7.2-alpine
    container_name: deepiri-redis
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 384m
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deepiri-network

  auth-service:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-auth-service/Dockerfile
    image: deepiri-auth-service:prod
    container_name: deepiri-auth-service
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 512m
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://${PLATFORM_DB_USER:-deepiri_platform}:${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}@postgres-platform:5432/${PLATFORM_DB_NAME:-platform}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: sh -c "if [ -f /usr/local/bin/prisma-baseline.sh ]; then /usr/local/bin/prisma-baseline.sh; else npx prisma migrate deploy || true; fi && node dist/server.js"
    depends_on:
      postgres-platform:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - deepiri-network

  registry:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-registry/Dockerfile
    image: deepiri-registry:prod
    container_name: deepiri-registry
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5003
      DATABASE_URL: postgresql://${PLATFORM_DB_USER:-deepiri_platform}:${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}@postgres-platform:5432/${PLATFORM_DB_NAME:-platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      postgres-platform:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - deepiri-network

  jobs:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-jobs/Dockerfile
    image: deepiri-jobs:prod
    container_name: deepiri-jobs
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5007
      DATABASE_URL: postgresql://${PLATFORM_DB_USER:-deepiri_platform}:${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}@postgres-platform:5432/${PLATFORM_DB_NAME:-platform}
      HELOX_URL: ${HELOX_URL:-}
      HELOX_API_KEY: ${HELOX_API_KEY:-}
      PG_BACKUP_SCHEDULER_ENABLED: ${PG_BACKUP_SCHEDULER_ENABLED:-true}
      PG_BACKUP_CRON: ${PG_BACKUP_CRON:-0 2 * * *}
      PG_BACKUP_HOST: postgres-platform
      PG_BACKUP_PORT: 5432
      PG_BACKUP_DB: ${PLATFORM_DB_NAME:-platform}
      PG_BACKUP_USER: ${PLATFORM_DB_USER:-deepiri_platform}
      PG_BACKUP_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
      PG_BACKUP_DIR: /backups/postgres
      PG_BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - postgres_backups:/backups/postgres
    depends_on:
      postgres-platform:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - deepiri-network

  external-bridge-service:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-external-bridge-service/Dockerfile
    image: deepiri-external-bridge-service:prod
    container_name: deepiri-external-bridge-service
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 384m
    environment:
      NODE_ENV: production
      PORT: 5006
      DATABASE_URL: postgresql://${PLATFORM_DB_USER:-deepiri_platform}:${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}@postgres-platform:5432/${PLATFORM_DB_NAME:-platform}
      AUTH_SERVICE_URL: http://auth-service:5001
      EXTERNAL_BRIDGE_BASE_URL: ${EXTERNAL_BRIDGE_BASE_URL:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # Cloud: HTTP poll + Postgres only — no Kafka on VPS
      KAFKA_BROKERS: ""
      PLAKY_API_TOKEN: ${PLAKY_API_TOKEN:-}
      PLAKY_POLL_INTERVAL_SEC: ${PLAKY_POLL_INTERVAL_SEC:-60}
    depends_on:
      postgres-platform:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - deepiri-network

  api-gateway:
    <<: *default-env
    build:
      context: ./platform-services
      dockerfile: backend/deepiri-api-gateway/Dockerfile
    image: deepiri-api-gateway:prod
    container_name: deepiri-api-gateway
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 768m
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres-platform
      DB_PORT: 5432
      DB_NAME: ${PLATFORM_DB_NAME:-platform}
      DB_USER: ${PLATFORM_DB_USER:-deepiri_platform}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?PLATFORM_DB_PASSWORD must be set}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:5001
      REGISTRY_URL: http://registry:5003
      JOBS_URL: http://jobs:5007
      EXTERNAL_BRIDGE_SERVICE_URL: http://external-bridge-service:5006
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:?INTERNAL_SERVICE_SECRET must be set}
      CLOUD_PORTAL_MODE: "true"
    depends_on:
      auth-service:
        condition: service_healthy
      registry:
        condition: service_healthy
      jobs:
        condition: service_healthy
      external-bridge-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - deepiri-network

  platform-frontend:
    <<: *default-env
    build:
      context: ./deepiri-web-frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL must be set}
        VITE_ENABLE_LIS: "false"
        VITE_ENABLE_CYREX: "false"
        VITE_ENABLE_AI_WORKSPACE: "false"
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
    image: deepiri-platform-frontend:prod
    container_name: deepiri-platform-frontend
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 256m
    depends_on:
      - api-gateway
    networks:
      deepiri-network:
        aliases:
          - frontend

  nginx:
    <<: *default-env
    image: nginx:alpine
    container_name: deepiri-nginx
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/cloud-prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - platform-frontend
      - api-gateway
    networks:
      - deepiri-network

  pg-backup-offsite:
    image: rclone/rclone:latest
    container_name: deepiri-pg-backup-offsite
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 128m
    environment:
      BACKUP_DIR: /backups/postgres
      BACKUP_OFFSITE_ENABLED: ${BACKUP_OFFSITE_ENABLED:-false}
      BACKUP_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-Other}
      BACKUP_OFFSITE_BUCKET: ${BACKUP_OFFSITE_BUCKET:-}
      BACKUP_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      BACKUP_OFFSITE_REGION: ${BACKUP_OFFSITE_REGION:-}
      BACKUP_OFFSITE_ACCESS_KEY_ID: ${BACKUP_OFFSITE_ACCESS_KEY_ID:-}
      BACKUP_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_OFFSITE_SECRET_ACCESS_KEY:-}
      BACKUP_OFFSITE_PREFIX: ${BACKUP_OFFSITE_PREFIX:-postgres-backups}
    volumes:
      - ./scripts/database/postgres-backup-offsite-sync.sh:/usr/local/bin/postgres-backup-offsite-sync.sh:ro
      - postgres_backups:/backups/postgres:ro
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do sh /usr/local/bin/postgres-backup-offsite-sync.sh; sleep 24h & wait $${!}; done"
    depends_on:
      - jobs
    networks:
      - deepiri-network

  certbot:
    image: certbot/certbot:latest
    container_name: deepiri-certbot
    restart: unless-stopped
    logging: *minimal-logging
    mem_limit: 128m
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - deepiri-network

volumes:
  postgres_platform_data:
  postgres_backups:
  redis_data:
  certbot_conf:
  certbot_webroot:

networks:
  deepiri-network:
    driver: bridge
