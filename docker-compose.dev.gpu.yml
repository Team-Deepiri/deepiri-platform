# GPU override for ollama — apply on top of docker-compose.dev.yml
#
# Usage:
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.gpu.yml up -d ollama
#
# Requires: NVIDIA GPU + nvidia-container-toolkit installed

services:
  ollama:
    runtime: nvidia
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      OLLAMA_NUM_GPU: "1"
      OLLAMA_GPU_OVERHEAD: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
