# QA Team — monolithic full stack (legacy path).
#
# Preferred for QA onboarding / day-to-day (PR #301):
#   Tier 1 → teams/frontend-team.yml   (./setup-deepiri-dev.sh start qa-tier-1)
#   Tier 2 → teams/backend-team.yml    (./setup-deepiri-dev.sh start qa-tier-2)
#   Tier 3 → teams/ai-team.yml         (./setup-deepiri-dev.sh start qa-tier-3)
#
# Interactive onboard: pick QA → tier menu remaps TEAM_FOLDER to those eng YAMLs.
# Use this file only when you explicitly want the full QA service set.
id: qa-team
display: QA Team (monolithic)

services:
  - postgres-auth
  - postgres-core
  - postgres-intelligence
  - redis
  - influxdb
  - kafka
  - api-gateway
  - auth-service
  - truss
  - registry
  - telemetry
  - messaging-service
  - external-bridge-service
  - jobs
  - realtime-gateway
  - language-intelligence-service
  - synapse
  - synapse-sugar-glider
  - frontend-dev
  - adminer

submodules:
  - deepiri-logger
  - deepiri-suite
  - deepiri-ollama-utils
  - deepiri-web-frontend
  - platform-services/shared/deepiri-synapse
  - platform-services/shared/deepiri-sugar-glider
  - platform-services/shared/deepiri-shared-utils
  - platform-services/shared/deepiri-prismpipe
  - platform-services/backend/deepiri-auth-service
  - platform-services/backend/deepiri-external-bridge-service
  - platform-services/backend/deepiri-api-gateway
  - platform-services/backend/deepiri-language-intelligence-service

build:
  buildkit: false
  sequential: true
  ensure_suite_images: true

start:
  no_deps: true
  optional:
    - language-intelligence-service
  phases:
    - [postgres-auth, postgres-core, postgres-intelligence, redis, influxdb, kafka, synapse, synapse-sugar-glider]
    - [api-gateway, auth-service, truss, registry, telemetry, messaging-service, external-bridge-service, jobs, realtime-gateway, adminer]
  phase_wait_seconds: 3

pull:
  recursive: false
  checkout_main: false
  setup_hooks: true
  optional:
    - platform-services/shared/deepiri-prismpipe
    - deepiri-ollama-utils

urls:
  - "Frontend: http://localhost:5173"
  - "API Gateway: http://localhost:5100"
  - "Auth Service: http://localhost:5001"
  - "Synapse: http://localhost:8002"
  - "Adminer: http://localhost:8080"
