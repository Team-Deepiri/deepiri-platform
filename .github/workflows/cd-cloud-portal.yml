# CD: Cloud portal → Netcup VPS 1000 G12 (platform.deepiri.com)
#
# Deploys the cloud portal stack (docker-compose.yml) to the cheap one-box VPS.
# Triggers on push to `main` and on manual dispatch.
#
# `main` is the single deploy source. Deploying from a feature branch is what
# let production drift onto perf/cloud-frontend-optimization for a month while
# main carried different code; do not repoint this at a non-main branch.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST              e.g. 159.195.234.19
#   VPS_USER              e.g. root
#   VPS_SSH_KEY           private key (ed25519 or rsa) paired with VPS ~/.ssh/authorized_keys
# Optional secrets:
#   VPS_PORT              default 22
#   VPS_DEPLOY_PATH       default /opt/deepiri/deepiri-platform
# Runtime env for the stack is one GitHub secret per variable, assembled in
# the "Assemble and write secrets .env" step below. Add a variable there AND
# as a repo secret; the deploy fails fast if any required value is empty.
#
name: CD Cloud Portal Deploy

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'deepiri-web-frontend'
      - 'deepiri-web-frontend/**'
      - 'platform-services/**'
      - 'scripts/database/**'
      - 'ops/nginx/**'
      - 'ops/k8s/**'
      - '.github/workflows/cd-cloud-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-cloud-portal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          token: ${{ secrets.PLATFORM_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Init cloud submodules
        env:
          TOKEN: ${{ secrets.PLATFORM_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          CLOUD_SUBMODULES=(
            deepiri-suite
            deepiri-web-frontend
            platform-services/backend/deepiri-api-gateway
            platform-services/backend/deepiri-auth-service
            platform-services/backend/deepiri-external-bridge-service
            platform-services/shared/deepiri-shared-utils
          )
          git submodule sync "${CLOUD_SUBMODULES[@]}"
          git submodule update --init --depth 1 "${CLOUD_SUBMODULES[@]}"
          # Verify frontend build contexts exist
          test -f deepiri-web-frontend/package.json
          test -f platform-services/backend/deepiri-auth-service/package.json

      - name: Setup SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/deepiri/deepiri-platform' }}
        run: |
          set -euo pipefail
          # rsync the source tree (no .git, no node_modules — container builds reinstall)
          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_key -p ${VPS_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'DEPLOYED.txt' \
            ./ "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/"

      - name: Assemble and write secrets .env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/deepiri/deepiri-platform' }}
        run: |
          set -euo pipefail
          umask 077

          # One GitHub secret per variable, assembled explicitly here.
          #
          # This replaces a single opaque VPS_ENV_FILE blob. GitHub secrets are
          # write-only, so nobody could read back what that blob declared. It went
          # stale, and twice in one night people believed they had updated it when
          # they had only edited the live box -- whose .env this step overwrites on
          # every deploy. The declared state is now visible in this file: reviewable
          # in a PR diff, git-blame-able, and impossible to drop a variable without
          # it showing up as a workflow change.
          #
          # The heredoc delimiter is QUOTED. GitHub substitutes secret expressions
          # bash sees this script, so a quoted delimiter stops bash from then
          # expanding a '$' or backtick that appears inside a secret VALUE -- which
          # would silently corrupt a password or key.
          cat > /tmp/deploy.env <<'ENVEOF'
          ANNOUNCEMENTS_CHANNEL_ID=${{ secrets.ANNOUNCEMENTS_CHANNEL_ID }}
          BACKUP_OFFSITE_ENABLED=${{ secrets.BACKUP_OFFSITE_ENABLED }}
          CLIENT_URL=${{ secrets.CLIENT_URL }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
          EXTERNAL_BRIDGE_BASE_URL=${{ secrets.EXTERNAL_BRIDGE_BASE_URL }}
          INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NODE_ENV=${{ secrets.NODE_ENV }}
          NOROZO_ANNOUNCEMENTS_WEBHOOK_URL=${{ secrets.NOROZO_ANNOUNCEMENTS_WEBHOOK_URL }}
          NOROZO_WEBHOOK_SECRET=${{ secrets.NOROZO_WEBHOOK_SECRET }}
          PLAKY_POLL_INTERVAL_SEC=${{ secrets.PLAKY_POLL_INTERVAL_SEC }}
          PLATFORM_ANNOUNCEMENTS_WEBHOOK_SECRET=${{ secrets.PLATFORM_ANNOUNCEMENTS_WEBHOOK_SECRET }}
          PLATFORM_DB_NAME=${{ secrets.PLATFORM_DB_NAME }}
          PLATFORM_DB_PASSWORD=${{ secrets.PLATFORM_DB_PASSWORD }}
          PLATFORM_DB_USER=${{ secrets.PLATFORM_DB_USER }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          ENVEOF

          # Fail BEFORE touching the remote file. The only pre-existing guard was
          # `[ -f .env ]`, which a file full of empty values passes happily; an
          # unset or misspelled secret renders as an empty string, so without this
          # the stack would start misconfigured instead of failing loudly.
          missing=""
          for k in ANNOUNCEMENTS_CHANNEL_ID BACKUP_OFFSITE_ENABLED CLIENT_URL CORS_ORIGINS DISCORD_BOT_TOKEN EXTERNAL_BRIDGE_BASE_URL INTERNAL_SERVICE_SECRET JWT_SECRET NODE_ENV NOROZO_ANNOUNCEMENTS_WEBHOOK_URL NOROZO_WEBHOOK_SECRET PLAKY_POLL_INTERVAL_SEC PLATFORM_ANNOUNCEMENTS_WEBHOOK_SECRET PLATFORM_DB_NAME PLATFORM_DB_PASSWORD PLATFORM_DB_USER POSTGRES_DB POSTGRES_PASSWORD POSTGRES_USER REDIS_PASSWORD VITE_API_URL; do
            grep -qE "^${k}=.+" /tmp/deploy.env || missing="${missing} ${k}"
          done
          if [ -n "${missing}" ]; then
            echo "ERROR: required secret(s) empty or unset:${missing}"
            echo "Create them in Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          echo "Assembled .env with $(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' /tmp/deploy.env) variables, all non-empty"

          scp -i ~/.ssh/vps_key -P "${VPS_PORT}" -o StrictHostKeyChecking=no \
            /tmp/deploy.env "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/ops/k8s/secrets/.env"
          ssh -i ~/.ssh/vps_key -p "${VPS_PORT}" -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
            "chmod 600 ${VPS_PATH}/ops/k8s/secrets/.env && echo 'Wrote .env'"
          rm -f /tmp/deploy.env

      - name: Build & restart on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/deepiri/deepiri-platform' }}
        run: |
          set -euo pipefail
          # NOTE: the remote script is slurped into a file and then executed —
          # NOT piped to `bash -s`. `ensure-dummy-cert.sh` runs `docker compose run`
          # (interactive stdin by default), which, when the script is on ssh stdin,
          # swallows the rest of the heredoc so the build/up/reload lines never run
          # (the step still exits 0). `cat > file && bash file` gives those commands
          # a clean stdin.
          ssh -T -i ~/.ssh/vps_key -p "${VPS_PORT}" -o StrictHostKeyChecking=no "${VPS_USER}@${VPS_HOST}" \
            'd=$(mktemp) || exit 1; cat > "$d"; bash "$d"; rc=$?; rm -f "$d"; exit $rc' <<'EOSSH'
          set -euo pipefail
          VPS_PATH="${{ secrets.VPS_DEPLOY_PATH || '/opt/deepiri/deepiri-platform' }}"
          cd "$VPS_PATH"
          if [ ! -f ops/k8s/secrets/.env ]; then
            echo "ERROR: ops/k8s/secrets/.env missing on VPS — deploy the secrets archive first"
            exit 1
          fi
          set -a && . ./ops/k8s/secrets/.env && set +a
          # Ensure nginx can bind :443 (dummy cert if no real cert yet)
          ./ops/nginx/ensure-dummy-cert.sh platform.deepiri.com -- -f docker-compose.yml || true
          # Build changed images and recreate - build frontend explicitly so
          # Docker correctly detects submodule content changes (rsync --delete).
          # --pull: without it, `build` reuses whatever ghcr.io/team-deepiri/
          # deepiri-suite:18-slim is cached on the box. That tag is MUTABLE --
          # republishing it does not change the name -- so a service could be
          # rebuilt from a months-old base image and nobody would see it. That
          # happened: a fix to prisma-baseline.sh (baked into that base image)
          # published successfully and still did not reach the running
          # container, because the build silently reused the stale local copy.
          docker compose -f docker-compose.yml build --pull platform-frontend
          docker compose -f docker-compose.yml build --pull api-gateway auth-service registry jobs external-bridge-service
          # No --force-recreate: Compose hashes each service's resolved config
          # (image id, env, volumes, command) and recreates ONLY what actually
          # changed. --force-recreate tore down all 12 services on every deploy
          # regardless of what the commit touched, causing a full-stack outage
          # (~30-60s, Cloudflare 521) even for single-service changes. The
          # explicit builds above produce new image ids, so changed services are
          # still detected and recreated correctly.
          #
          # It also reduced churn that caused a real incident: recreating a
          # container gives it a new IP on the docker network, and nginx caches
          # upstream IPs until reloaded -- fewer recreates means fewer chances
          # of a stale upstream. The reload below still runs regardless.
          docker compose -f docker-compose.yml up -d
          docker exec deepiri-nginx nginx -s reload 2>/dev/null || true
          echo "=== containers ==="
          docker ps --format "table {{.Names}}\t{{.Status}}"
          echo "=== health ==="
          sleep 8
          curl -skS -o /dev/null -w "frontend: %{http_code}\n" https://127.0.0.1/ || true
          curl -skS https://127.0.0.1/api/health | head -c 300; echo
          EOSSH

      - name: Record deployed version on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || 22 }}
          VPS_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/deepiri/deepiri-platform' }}
        run: |
          set -euo pipefail
          # The tree is rsynced WITHOUT .git (see "Rsync to VPS"), so `git -C $VPS_PATH`
          # on the box fails with "not a git repository" and nobody can tell what is
          # actually deployed. This manifest is the box's answer to "what commit is this?".
          {
            echo "platform_commit: ${{ github.sha }}"
            echo "platform_ref:    ${{ github.ref_name }}"
            echo "deployed_at:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_url:         ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "submodules:"
            git ls-tree -r HEAD | awk '$2 == "commit" { print "  " $4 ": " $3 }'
          } > DEPLOYED.txt
          cat DEPLOYED.txt
          scp -i ~/.ssh/vps_key -P "${VPS_PORT}" -o StrictHostKeyChecking=no \
            DEPLOYED.txt "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/DEPLOYED.txt"

      - name: Verify via public domain
        run: |
          set -euo pipefail
          echo "Waiting for Cloudflare edge to see new origin..."
          sleep 10
          curl -sS -o /dev/null -w "https://platform.deepiri.com/ -> %{http_code} (time_total=%{time_total}s)\n" https://platform.deepiri.com/
          curl -sS https://platform.deepiri.com/api/health | head -c 400; echo
