# VPS Monitoring — lightweight, temporary resource sampling for the cheap one-box VPS.
#
# Not CD. Manual (workflow_dispatch) only. Installs a cron job on the Netcup
# VPS 1000 G12 that runs ops/monitoring/vps-sampler.sh once a minute, so we can
# collect ~1 week of CPU / load / steal / memory / disk data and decide whether
# the box is sustainable enough to commit to the annual plan.
#
# Reuses the same SSH secrets as cd-cloud-portal.yml:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY   (required)
#   VPS_PORT                          (optional, default 22)
#
# Actions:
#   status     — is the cron job there, how many rows collected, tail of the log
#   install    — copy the sampler to the box, add the crontab line, take one sample now
#   collect    — pull host.csv / containers.csv / log off the box as a build artifact
#   uninstall  — remove the crontab line (data is left in place for a final collect)
#   db-audit   — read-only Postgres audit: schema inventory, sizes, health stats
#
# Data lives at /opt/deepiri/monitoring/ on the box — a sibling of the deploy
# dir, so the CD rsync --delete never touches it.

name: VPS Monitoring

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the VPS
        required: true
        default: status
        type: choice
        options:
          - status
          - install
          - collect
          - uninstall
          - db-audit
  # A dispatch-only workflow that has never run, on a non-default branch, is
  # not registered with the Actions API — "Run workflow" never appears and
  # `gh workflow run` 404s. This narrow push trigger fires exactly once when
  # this file lands on dev, which registers the workflow and makes the other
  # actions available. It only ever runs the read-only `status` action, and
  # only when THIS file changes, so it can never touch a deployment.
  push:
    branches: [dev]
    paths:
      - .github/workflows/vps-monitoring.yml

permissions:
  contents: read

concurrency:
  group: vps-monitoring
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.action || 'status (registration run)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # job-level env: workflow-level env can't read the secrets context
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      MON_DIR: /opt/deepiri/monitoring
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # NOTE: every heredoc below is quoted (<<'EOSSH'), so its body is sent
      # verbatim to the remote bash over stdin. MON_DIR / CRON_LINE are set
      # *inside* the remote script — never passed on the ssh command line,
      # where the cron line's "* * * *" would glob-expand.

      # Also runs on the push registration event, where inputs.action is unset.
      - name: Status
        if: ${{ inputs.action == 'status' || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          MON_DIR=/opt/deepiri/monitoring
          echo "=== crontab ==="
          crontab -l 2>/dev/null | grep 'vps-sampler.sh' || echo "NOT INSTALLED — no crontab line"
          echo "=== files ==="
          ls -la "$MON_DIR" 2>/dev/null || echo "no $MON_DIR yet"
          echo "=== row counts ==="
          wc -l "$MON_DIR"/*.csv 2>/dev/null || echo "no csv yet"
          echo "=== last host samples ==="
          tail -n 3 "$MON_DIR/host.csv" 2>/dev/null || true
          echo "=== sampler.log tail ==="
          tail -n 15 "$MON_DIR/sampler.log" 2>/dev/null || true
          EOSSH

      - name: Install
        if: ${{ inputs.action == 'install' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$MON_DIR'"
          scp -i ~/.ssh/vps_key -P "$VPS_PORT" -o StrictHostKeyChecking=no \
            ops/monitoring/vps-sampler.sh "$VPS_USER@$VPS_HOST:$MON_DIR/vps-sampler.sh"
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          MON_DIR=/opt/deepiri/monitoring
          CRON_LINE='* * * * * flock -n /tmp/vps-sampler.lock /opt/deepiri/monitoring/vps-sampler.sh >> /opt/deepiri/monitoring/sampler.log 2>&1'
          chmod +x "$MON_DIR/vps-sampler.sh"
          command -v flock   >/dev/null || { echo "ERROR: flock not found (install util-linux)"; exit 1; }
          command -v crontab >/dev/null || { echo "ERROR: crontab not found (install cron)";     exit 1; }
          # Idempotent: drop any existing sampler line, re-add exactly one.
          ( crontab -l 2>/dev/null | grep -v 'vps-sampler.sh' || true; echo "$CRON_LINE" ) | crontab -
          echo "=== installed crontab line ==="
          crontab -l | grep 'vps-sampler.sh'
          echo "=== immediate test sample ==="
          "$MON_DIR/vps-sampler.sh"
          tail -n 1 "$MON_DIR/host.csv"
          echo "--- containers ---"
          tail -n 20 "$MON_DIR/containers.csv"
          EOSSH

      - name: Collect
        if: ${{ inputs.action == 'collect' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" \
            "cd '$MON_DIR' && tar czf - --ignore-failed-read host.csv containers.csv sampler.log \$(ls *.old 2>/dev/null || true)" \
            > vps-monitoring-data.tar.gz || true
          if [ ! -s vps-monitoring-data.tar.gz ]; then
            echo "ERROR: nothing collected — is the sampler installed? (run 'status')"
            exit 1
          fi
          echo "=== archive contents ==="
          tar tzvf vps-monitoring-data.tar.gz

      - name: Upload artifact
        if: ${{ inputs.action == 'collect' }}
        uses: actions/upload-artifact@v4
        with:
          name: vps-monitoring-data
          path: vps-monitoring-data.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Uninstall
        if: ${{ inputs.action == 'uninstall' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          MON_DIR=/opt/deepiri/monitoring
          ( crontab -l 2>/dev/null | grep -v 'vps-sampler.sh' || true ) | crontab -
          echo "cron line removed. Data kept at $MON_DIR:"
          ls -la "$MON_DIR" 2>/dev/null || true
          echo "Run 'collect' once more for the final data, then: rm -rf $MON_DIR"
          EOSSH

      # Read-only Postgres audit. Connects over the container's local socket as
      # the bootstrap superuser (the postgres image defaults local connections
      # to trust, which the existing pg_isready healthcheck already relies on),
      # so no DB password is read, passed, or printed. Every statement is a
      # SELECT against pg_catalog / pg_stat_* — no table data is returned.
      - name: DB audit
        if: ${{ inputs.action == 'db-audit' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/vps_key -p "$VPS_PORT" -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          PGC=deepiri-postgres-platform
          DB="$(docker exec "$PGC" printenv PLATFORM_DB_NAME 2>/dev/null || echo platform)"
          echo "Auditing database: $DB"
          q() { docker exec "$PGC" psql -U postgres -d "$DB" -X -A -F'|' -P pager=off -c "$1"; }

          echo "########## VERSION / UPTIME ##########"
          q "SELECT version();"
          q "SELECT date_trunc('second', now() - pg_postmaster_start_time()) AS uptime;"

          echo "########## DATABASES ##########"
          q "SELECT datname, pg_size_pretty(pg_database_size(datname)) AS size
               FROM pg_database WHERE datistemplate = false ORDER BY 1;"

          echo "########## SCHEMAS ##########"
          q "SELECT nspname FROM pg_namespace
              WHERE nspname NOT LIKE 'pg\_%' AND nspname <> 'information_schema' ORDER BY 1;"

          echo "########## EXTENSIONS ##########"
          q "SELECT extname, extversion FROM pg_extension ORDER BY 1;"

          echo "########## TABLE INVENTORY (est rows + size) ##########"
          q "SELECT n.nspname AS schema, c.relname AS tbl,
                    c.reltuples::bigint AS est_rows,
                    pg_size_pretty(pg_total_relation_size(c.oid)) AS total_size
               FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relkind = 'r'
                AND n.nspname NOT LIKE 'pg\_%' AND n.nspname <> 'information_schema'
              ORDER BY 1, 2;"

          echo "########## TABLE COUNT BY SCHEMA ##########"
          q "SELECT n.nspname AS schema, count(*) AS tables
               FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE c.relkind = 'r'
                AND n.nspname NOT LIKE 'pg\_%' AND n.nspname <> 'information_schema'
              GROUP BY 1 ORDER BY 1;"

          echo "########## CONNECTIONS ##########"
          q "SELECT (SELECT count(*) FROM pg_stat_activity) AS current_conns,
                    (SELECT setting FROM pg_settings WHERE name = 'max_connections') AS max_allowed;"
          q "SELECT coalesce(state,'(null)') AS state, count(*)
               FROM pg_stat_activity GROUP BY 1 ORDER BY 2 DESC;"

          echo "########## CACHE HIT RATIO / IO ##########"
          q "SELECT datname, blks_hit, blks_read,
                    CASE WHEN blks_hit + blks_read = 0 THEN NULL
                         ELSE round(100.0 * blks_hit / (blks_hit + blks_read), 2) END AS cache_hit_pct,
                    xact_commit, xact_rollback, deadlocks, temp_files
               FROM pg_stat_database WHERE datname = '$DB';"

          echo "########## KEY SETTINGS ##########"
          q "SELECT name, setting, unit FROM pg_settings
              WHERE name IN ('shared_buffers','work_mem','maintenance_work_mem',
                             'effective_cache_size','max_connections','wal_level',
                             'autovacuum','fsync','synchronous_commit')
              ORDER BY 1;"

          echo "########## VACUUM / DEAD TUPLES ##########"
          q "SELECT schemaname, relname, n_live_tup, n_dead_tup,
                    last_autovacuum, last_autoanalyze
               FROM pg_stat_user_tables
              WHERE n_dead_tup > 0 OR last_autovacuum IS NOT NULL
              ORDER BY n_dead_tup DESC LIMIT 25;"

          echo "########## INDEX USAGE (least used first) ##########"
          q "SELECT schemaname, relname, indexrelname, idx_scan,
                    pg_size_pretty(pg_relation_size(indexrelid)) AS size
               FROM pg_stat_user_indexes ORDER BY idx_scan ASC, 1, 2 LIMIT 30;"

          echo "########## PASSWORD STORAGE FORMAT ##########"
          # Classifies the hash format by prefix and returns COUNTS ONLY.
          # No hash, email, or other row value is ever selected or printed.
          q "SELECT CASE
                      WHEN password IS NULL OR password = '' THEN 'empty/null'
                      WHEN password LIKE '\$2a\$%' OR password LIKE '\$2b\$%'
                        OR password LIKE '\$2y\$%' THEN 'bcrypt (ok)'
                      WHEN password LIKE '\$argon2%' THEN 'argon2 (ok)'
                      WHEN password LIKE '\$scrypt\$%' THEN 'scrypt (ok)'
                      WHEN password ~ '^[a-f0-9]{64}\$' THEN 'sha256 hex (WEAK - unsalted)'
                      WHEN password ~ '^[a-f0-9]{32}\$' THEN 'md5 hex (WEAK)'
                      ELSE 'UNRECOGNISED - possible plaintext'
                    END AS storage_format,
                    count(*) AS accounts,
                    min(length(password)) AS min_len,
                    max(length(password)) AS max_len
               FROM public.users GROUP BY 1 ORDER BY 2 DESC;"

          echo "########## ACCOUNT HYGIENE ##########"
          # Diagnoses the common login failures: email case/whitespace mismatch
          # (login does an exact findUnique, so either breaks it), unexpected
          # hash format, and whether a password was recently changed.
          # No password hash value is selected — only its prefix and length.
          q "SELECT id, email,
                    length(email)            AS email_len,
                    email <> lower(email)    AS has_uppercase,
                    email <> btrim(email)    AS has_whitespace,
                    left(password, 4)        AS hash_type,
                    length(password)         AS hash_len,
                    status, email_verified,
                    last_login_at, updated_at
               FROM public.users ORDER BY created_at;"

          echo "########## BACKUPS (postgres_backups volume) ##########"
          docker exec deepiri-jobs sh -c 'ls -la /backups/postgres 2>/dev/null || echo "backup dir not present/readable"' || echo "jobs container unavailable"
          EOSSH
