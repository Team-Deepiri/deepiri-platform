name: Platform Build and Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: platform-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-ci:
    name: Submodules + Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PLATFORM_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Init submodules (private repos)
        env:
          TOKEN: ${{ secrets.PLATFORM_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN cannot read other private repos; prefer PLATFORM_ACCESS_TOKEN (repo read).
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Verify submodules checked out
        run: |
          set -euo pipefail
          test -f platform-services/backend/deepiri-api-gateway/package.json
          test -f platform-services/shared/deepiri-shared-utils/package.json
          test -f platform-services/shared/deepiri-sugar-glider/go.mod
          test -f deepiri-suite/Dockerfile
          test -f diri-cyrex/Dockerfile
          echo "Submodule paths present"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: platform-services/shared/deepiri-shared-utils/package-lock.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bootstrap CI secrets
        run: |
          set -euo pipefail
          SECRETS_DIR=ops/k8s/secrets
          mkdir -p "$SECRETS_DIR"
          JWT_SECRET=ci-jwt-secret-minimum-32-characters-long
          INTERNAL_SERVICE_SECRET=ci-internal-service-secret
          REDIS_PASSWORD=password
          INFLUXDB_TOKEN=ci-influxdb-token-minimum-48-characters-for-validation-xx
          write_secret() {
            local svc="$1"
            {
              echo "apiVersion: v1"
              echo "kind: Secret"
              echo "metadata:"
              echo "  name: ${svc}-secret"
              echo "  namespace: default"
              echo "type: Opaque"
              echo "stringData:"
              echo "  JWT_SECRET: \"${JWT_SECRET}\""
              echo "  INTERNAL_SERVICE_SECRET: \"${INTERNAL_SERVICE_SECRET}\""
              echo "  REDIS_PASSWORD: \"${REDIS_PASSWORD}\""
              echo "  INFLUXDB_TOKEN: \"${INFLUXDB_TOKEN}\""
            } >"$SECRETS_DIR/${svc}-secret.yaml"
          }
          for svc in \
            api-gateway auth-service workflow-orchestrator incentive-engine decision-intelligence \
            external-bridge-service adaptive-experience-engine language-intelligence-service \
            communications-hub messaging-service realtime-gateway synapse sugar-glider frontend-dev cyrex; do
            write_secret "$svc"
          done

      - name: Validate compose file
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.dev.yml config --services | grep -qx sugar-glider
          docker compose -f docker-compose.dev.yml config | grep -q 'deepiri-dev-sugar-glider:latest'

      - name: Build platform Docker services
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          set -euo pipefail
          ensure_suite_image() {
            local tag="$1"
            local base="$2"
            local img="ghcr.io/team-deepiri/deepiri-suite:${tag}"
            if docker image inspect "$img" >/dev/null 2>&1; then
              echo "  ok $img (cached)"
              return 0
            fi
            echo "  pulling $img..."
            if docker pull "$img" 2>/dev/null; then
              echo "  ok $img (pulled)"
              return 0
            fi
            echo "  building $img from deepiri-suite submodule..."
            docker build --build-arg "BASE_IMAGE=${base}" -t "$img" ./deepiri-suite
          }
          echo "==> Ensuring deepiri-suite base images"
          ensure_suite_image "18-alpine" "node:18-alpine"
          ensure_suite_image "18-slim" "node:18-slim"
          ensure_suite_image "20-alpine" "node:20-alpine"
          echo "==> Building deepiri-shared-utils (required by Node service Dockerfiles)"
          npm ci --legacy-peer-deps --prefix platform-services/shared/deepiri-shared-utils
          npm run build --prefix platform-services/shared/deepiri-shared-utils
          PLATFORM_SERVICES=(
            api-gateway
            auth-service
            workflow-orchestrator
            incentive-engine
            decision-intelligence
            external-bridge-service
            adaptive-experience-engine
            language-intelligence-service
            communications-hub
            messaging-service
            realtime-gateway
            synapse
            sugar-glider
          )
          failed=()
          for svc in "${PLATFORM_SERVICES[@]}"; do
            echo ""
            echo "── docker compose build $svc ──"
            if ! docker compose -f docker-compose.dev.yml build "$svc"; then
              failed+=("$svc")
            fi
          done
          if ((${#failed[@]} > 0)); then
            echo "FAILED builds: ${failed[*]}"
            exit 1
          fi

      - name: Smoke test sugar-glider image
        run: |
          set -euo pipefail
          docker run --rm deepiri-dev-sugar-glider:latest /app/sidecar healthcheck
