events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;

    upstream frontend {
        server frontend:80;
    }

    upstream api_gateway {
        server api-gateway:5000;
    }

    # Boardman runs as its OWN docker-compose project at /opt/deepiri/deepiri-boardman
    # (own containers, own Postgres) — not part of this stack's compose file, so it is
    # never touched by this file's --force-recreate. boardman-nginx already splits UI
    # vs /api/ internally (see deepiri-boardman/deploy/nginx/default.conf), so this
    # just needs one upstream pointing at it over the shared docker network.
    # Plain HTTP: only serves the Let's Encrypt ACME challenge (see
    # ops/nginx/init-letsencrypt.sh) and a bare health check; everything
    # else is pushed to HTTPS. Certs come from the certbot-managed
    # /etc/letsencrypt volume — see the `certbot` service in docker-compose.yml.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/letsencrypt/live/current/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location = /api/health {
            proxy_pass http://api_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api_gateway/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # No /socket.io/ or /ws routes — realtime-gateway isn't part of the
        # cloud profile (control-plane only, per the platform/control-plane
        # split). Re-add these if a cloud-side realtime service ever exists.

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Boardman — boardman.deepiri.com → GitHub↔Plaky sync agent (own compose project
    # at /opt/deepiri/deepiri-boardman; see the `boardman` upstream above).
    server {
        listen 80;
        server_name boardman.deepiri.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name boardman.deepiri.com;

        # Reuse current cert for now, same as games.deepiri.com below; expand the
        # cert to cover this hostname (or issue a dedicated one) when convenient.
        ssl_certificate     /etc/letsencrypt/live/current/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # boardman-nginx already splits its own /api/ vs static UI internally —
        # this is a single proxy_pass for everything under this hostname.
        location / {
            # Resolve boardman-nginx at REQUEST time, not at nginx startup.
            #
            # A static `upstream` block resolves its member once when nginx starts and
            # caches the IP forever. Boardman is a separate compose project, so every
            # time it redeploys its containers get new IPs — and this nginx keeps
            # proxying to an address that no longer exists, returning 502 until someone
            # reloads it. That happened tonight, in both directions: platform nginx
            # holding a stale api-gateway IP, and boardman's own nginx holding a stale
            # boardman API IP.
            #
            # Putting the address in a VARIABLE forces nginx to consult the resolver per
            # request. 127.0.0.11 is docker's embedded DNS. Now Boardman can redeploy as
            # often as it likes and neither side has to reload the other's nginx.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $boardman_upstream http://boardman-nginx:80;
            proxy_pass $boardman_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # GitHub webhook bodies can be a few hundred KB with a large diff payload.
            client_max_body_size 5m;
        }
    }

    # Games — games.deepiri.com → lyback static + future ws
    server {
        listen 80;
        server_name games.deepiri.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name games.deepiri.com;

        # Reuse current cert for now (platform cert); certbot will expand to games later
        ssl_certificate     /etc/letsencrypt/live/current/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000" always;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Resolve at request time, not startup — a static upstream block caches the
        # container IP and strands nginx on a dead address after a redeploy.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Root now hosts two games; send bare visits to Lyback, which is what
        # games.deepiri.com/ served before this change.
        location = / {
            return 302 /lyback/;
        }

        # Voxier — Godot 4 web export.
        #
        # COOP/COEP are REQUIRED, not hardening: Godot 4 web builds use
        # SharedArrayBuffer, which browsers only expose in a cross-origin-isolated
        # context. Without both headers the page loads and the engine silently
        # fails to start — a blank canvas that reads as a broken build.
        #
        # Scoped to this location deliberately. Applied server-wide, require-corp
        # would also isolate Lyback, which does not need it and may load
        # cross-origin assets.
        location /voxier/ {
            # rewrite + proxy_pass WITHOUT a URI part.
            #
            # With a variable in proxy_pass, nginx cannot do its usual
            # location-prefix substitution: a URI part is used AS-IS and the
            # rest of the request path is discarded. `proxy_pass $up/;` sent
            # every request to `/`, so index.wasm, index.js and index.pck all
            # returned index.html. Strip the prefix explicitly instead.
            rewrite ^/voxier/(.*)$ /$1 break;
            set $voxier_upstream http://voxier:80;
            proxy_pass $voxier_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Embedder-Policy require-corp always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            # 35MB wasm — give it room and time.
            proxy_read_timeout 300s;
            client_max_body_size 64m;
        }

        # Lyback moved from / to /lyback/.
        location /lyback/ {
            # rewrite + proxy_pass WITHOUT a URI part.
            #
            # With a variable in proxy_pass, nginx cannot do its usual
            # location-prefix substitution: a URI part is used AS-IS and the
            # rest of the request path is discarded. `proxy_pass $up/;` sent
            # every request to `/`, so index.wasm, index.js and index.pck all
            # returned index.html. Strip the prefix explicitly instead.
            rewrite ^/lyback/(.*)$ /$1 break;
            set $lyback_upstream http://lyback:80;
            proxy_pass $lyback_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Future multiplayer WS
        location /lyback/ws {
            rewrite ^/lyback/ws(.*)$ /ws$1 break;
            set $lyback_ws_upstream http://lyback:80;
            proxy_pass $lyback_ws_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
