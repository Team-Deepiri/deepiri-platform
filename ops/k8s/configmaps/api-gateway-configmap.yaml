apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: default
  annotations:
    description: "Cloud portal API Gateway — slim routes, no Cyrex/LIS upstreams"
    plane: cloud-portal
data:
  NODE_ENV: "production"
  PORT: "5000"
  CLOUD_PORTAL_MODE: "true"
  AUTH_SERVICE_URL: "http://auth-service:5001"
  REGISTRY_URL: "http://registry:5003"
  JOBS_URL: "http://jobs:5007"
  EXTERNAL_BRIDGE_SERVICE_URL: "http://external-bridge-service:5006"
  DB_HOST: "postgres-platform"
  DB_PORT: "5432"
  DB_NAME: "platform"
  DB_USER: "deepiri_platform"
