apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: default
  annotations:
    description: "ConfigMap for API Gateway service - public configuration"
data:
  # Server Configuration
  NODE_ENV: "development"
  PORT: "5000"
  
  # Service URLs (internal Docker/K8s service names)
  AUTH_SERVICE_URL: "http://auth-service:5001"
  WORKFLOW_ORCHESTRATOR_URL: "http://workflow-orchestrator:5002"
  INCENTIVE_ENGINE_URL: "http://incentive-engine:5003"
  DECISION_INTELLIGENCE_URL: "http://decision-intelligence:5004"
  COMMUNICATIONS_HUB_URL: "http://communications-hub:5005"
  EXTERNAL_BRIDGE_SERVICE_URL: "http://external-bridge-service:5006"
  ADAPTIVE_EXPERIENCE_ENGINE_URL: "http://adaptive-experience-engine:5007"
  REALTIME_GATEWAY_URL: "http://realtime-gateway:5008"
  CYREX_URL: "http://cyrex:8000"
  SYNAPSE_URL: "http://synapse:8002"
  MLFLOW_URL: "http://mlflow:5000"
  PRISMPIPE_URL: "http://deepiri-prismpipe:5011"
  PRISMPIPE_ENABLED: "true"

