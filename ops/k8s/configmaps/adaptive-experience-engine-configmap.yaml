apiVersion: v1
kind: ConfigMap
metadata:
  name: adaptive-experience-engine-config
  namespace: default
  annotations:
    description: "ConfigMap for Adaptive Experience Engine - public configuration"
data:
  # Server Configuration
  NODE_ENV: "development"
  PORT: "5007"

  # Service URLs
  CYREX_URL: "http://cyrex:8000"
  
  # Streaming Service Configuration (for publishing challenge events)
  SYNAPSE_URL: "http://synapse:8002"

