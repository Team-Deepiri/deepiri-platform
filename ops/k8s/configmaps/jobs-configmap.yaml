apiVersion: v1
kind: ConfigMap
metadata:
  name: jobs-config
  namespace: default
  annotations:
    description: "Cloud portal Jobs — pg_backup scheduler, no Cyrex/Helox on VPS"
    plane: cloud-portal
data:
  NODE_ENV: "production"
  PORT: "5007"
  PG_BACKUP_SCHEDULER_ENABLED: "true"
  PG_BACKUP_CRON: "0 2 * * *"
  PG_BACKUP_HOST: "postgres-platform"
  PG_BACKUP_PORT: "5432"
  PG_BACKUP_DB: "platform"
  PG_BACKUP_USER: "deepiri_platform"
  PG_BACKUP_DIR: "/backups/postgres"
  PG_BACKUP_RETENTION_DAYS: "30"
