apiVersion: v1
kind: ConfigMap
metadata:
  name: incentive-engine-config
  namespace: default
  annotations:
    description: "ConfigMap for Incentive Engine - public configuration"
data:
  # Server Configuration
  NODE_ENV: "development"
  PORT: "5003"

  # Redis Configuration
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  
  # Streaming Service Configuration
  SYNAPSE_URL: "http://synapse:8002"

