apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-orchestrator-config
  namespace: default
  annotations:
    description: "ConfigMap for Workflow Orchestrator Service - public configuration"
data:
  # Server Configuration
  NODE_ENV: "development"
  PORT: "5002"

  # Streaming Service Configuration (for publishing task events)
  SYNAPSE_URL: "http://synapse:8002"

