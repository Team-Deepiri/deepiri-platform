apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-gateway-config
  namespace: default
  annotations:
    description: "ConfigMap for Realtime Gateway Service - public configuration"
data:
  # Server Configuration
  NODE_ENV: "development"
  PORT: "5008"
  
  # Streaming Service Configuration (for consuming events for real-time updates)
  SYNAPSE_URL: "http://synapse:8002"
  SYNAPSE_SUGAR_GLIDER_URL: "http://sugar-glider:8081"
  SYNAPSE_SIDECAR_URL: "http://sugar-glider:8081"
  SYNAPSE_GRPC_ADDR: "sugar-glider:50051"
  STREAM_TRANSPORT: "sugar-glider-grpc"
  STREAM_GRPC_KEEPALIVE_MS: "300000"
  STREAM_GRPC_KEEPALIVE_TIMEOUT_MS: "20000"
  STREAM_GRPC_KEEPALIVE_PERMIT_WITHOUT_CALLS: "false"
  STREAM_SHADOW_MODE: "false"
  STREAM_CONSUMER_GROUP: "realtime-gateway"
  STREAM_CONSUMER_NAME: "realtime-1"
  STREAM_SUBSCRIBE_BATCH_SIZE: "128"
  STREAM_EVENT_MAX_IN_FLIGHT: "1024"
  STREAM_EVENT_RESUME_IN_FLIGHT: "768"
  STREAM_ACK_BATCH_SIZE: "256"
  STREAM_ACK_FLUSH_MS: "6"
  STREAM_ACK_FLUSH_CONCURRENCY: "8"
  STREAM_ACK_RETRY_MAX_ATTEMPTS: "3"
  STREAM_ACK_RETRY_BASE_MS: "25"
  STREAM_ACK_LOW_TRAFFIC_FLUSH_MS: "1"
  STREAM_ACK_LOW_TRAFFIC_GAP_MS: "16"
  STREAM_ACK_LOW_TRAFFIC_MAX_PENDING: "32"
  STREAM_LAZY_PAYLOAD_PARSE: "true"
  STREAM_EXTRACT_USER_FROM_PAYLOAD: "false"
  STREAM_LANE_RUNTIME_PROFILES_ENABLED: "false"
  STREAM_DIRECT_BROADCAST_FAST_PATH: "off"
  STREAM_DIRECT_BROADCAST_MIN_PAYLOAD_BYTES: "0"
  SOCKET_IO_PARSER: "default"
  SOCKET_IO_DISCARD_INITIAL_REQUEST: "false"
  # Sugar Glider Mark v3 freeze baseline (fallback-safe defaults)
  SIDECAR_PUBLISH_PIPELINE_ENABLED: "true"
  SIDECAR_PUBLISH_PIPELINE_ADAPTIVE_ENABLED: "false"
  SIDECAR_PUBLISH_PIPELINE_MIN_BATCH: "2"
  SIDECAR_PUBLISH_PIPELINE_MAX_BATCH: "64"
  SIDECAR_PUBLISH_PIPELINE_FLUSH_MS: "0"
  SIDECAR_PUBLISH_PIPELINE_QUEUE_SIZE: "8192"
  SIDECAR_PUBLISH_PIPELINE_MAX_BYTES: "1048576"
  SIDECAR_WAL_MAX_ENTRIES: "100000"
  SIDECAR_WAL_MAX_BYTES: "268435456"
  SIDECAR_DLQ_STREAM_POLICIES: "platform-events:5:30000,model-events:5:30000,training-events:8:45000,speech-events:5:30000"
  
  # Redis Configuration (for WebSocket/pub-sub)
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
