apiVersion: v1
kind: ConfigMap
metadata:
  name: communications-hub-config
  namespace: default
  annotations:
    description: "ConfigMap for Communications Hub - public configuration"
data:
  # Server Configuration
  NODE_ENV: "development"
  PORT: "5005"
  
  # Database URLs (using Docker service names)
  DATABASE_URL: "postgresql://deepiri:deepiripassword@postgres-core:5432/deepiri"
  
  # Streaming Service Configuration (for consuming events to send notifications)
  SYNAPSE_URL: "http://synapse:8002"

