apiVersion: v1
kind: ConfigMap
metadata:
  name: decision-intelligence-config
  namespace: default
  annotations:
    description: "ConfigMap for Decision Intelligence Service - public configuration"
data:
  # Server Configuration
  NODE_ENV: "development"
  PORT: "5004"

  # InfluxDB Configuration
  INFLUXDB_URL: "http://influxdb:8086"
  INFLUXDB_ORG: "deepiri"
  INFLUXDB_BUCKET: "analytics"
  
  # Streaming Service Configuration (for consuming metrics events)
  SYNAPSE_URL: "http://synapse:8002"

