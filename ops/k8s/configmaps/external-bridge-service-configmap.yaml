apiVersion: v1
kind: ConfigMap
metadata:
  name: external-bridge-service-config
  namespace: default
  annotations:
    description: "Cloud portal External Bridge — Plaky HTTP poll, no Kafka"
    plane: cloud-portal
data:
  NODE_ENV: "production"
  PORT: "5006"
  AUTH_SERVICE_URL: "http://auth-service:5001"
  EXTERNAL_BRIDGE_BASE_URL: "https://portal.example.com/api/bridge"
  KAFKA_BROKERS: ""
  PLAKY_POLL_INTERVAL_SEC: "60"
