apiVersion: v1
kind: ConfigMap
metadata:
  name: external-bridge-service-config
  namespace: default
  annotations:
    description: "Cloud portal External Bridge — Plaky HTTP poll, no Kafka"
    plane: cloud-portal
data:
  NODE_ENV: "production"
  PORT: "5006"
  AUTH_SERVICE_URL: "http://auth-service:5001"
  EXTERNAL_BRIDGE_BASE_URL: "https://portal.example.com/api/bridge"
  KAFKA_BROKERS: ""
  PLAKY_POLL_INTERVAL_SEC: "60"
  # GitHub team-activity API for the portal People page (non-secret config;
  # GITHUB_APP_* / GITHUB_WEBHOOK_SECRET live in the secret).
  GITHUB_ORG: "Team-Deepiri"
  # Active product repos only — keeps /overview fast and relevant. No spaces.
  GITHUB_REPOS: "deepiri-platform,deepiri-web-frontend,deepiri-api-gateway,deepiri-auth-service,deepiri-external-bridge-service,deepiri-registry,deepiri-jobs,deepiri-control-plane,deepiri-language-intelligence-service,diri-cyrex"
  GITHUB_REPO_ACTIVE_DAYS: "120"
  GITHUB_CACHE_TTL_SECONDS: "600"
