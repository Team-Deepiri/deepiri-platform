name: ml.train-publish
description: Submit a Helox training job and wait for its result before publishing completion state.
metadata:
  owner: platform
  phase: phase1
steps:
  - id: submit-training
    kind: jobStep
    name: Submit Helox training job
    job:
      type: helox.train
      payloadFrom: input.training
      labels:
        source: truss
        template: ml.train-publish

  - id: require-success
    kind: conditionStep
    name: Require successful training result
    condition:
      path: steps.submit-training.status
      equals: completed

  - id: wait-publish-signal
    kind: waitEventStep
    name: Wait for publish signal
    event:
      type: model.publish.requested
      correlationPath: input.correlationId