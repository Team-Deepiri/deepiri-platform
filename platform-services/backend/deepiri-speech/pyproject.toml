[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "deepiri-speech"
version = "0.1.0"
description = "Deepiri self-hosted speech engine — VAD, STT, TTS, LiveKit voice worker"
readme = "README.md"
license = "Apache-2.0"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.112.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
pydantic = ">=2.8.0"
pydantic-settings = ">=2.2.0"
httpx = ">=0.27.0"
redis = { version = ">=5.0.0", extras = ["hiredis"] }
python-multipart = ">=0.0.9"
numpy = ">=1.24.0"

# Optional heavy engines (poetry install -E speech / SPEECH_EXTRAS=1)
faster-whisper = { version = ">=1.1.0", optional = true }
livekit-api = { version = ">=0.7.0", optional = true }
livekit-agents = { version = ">=0.12.0", optional = true }
torch = { version = ">=2.2.0", optional = true }

[tool.poetry.extras]
speech = ["faster-whisper", "livekit-api", "livekit-agents", "torch"]
full = ["speech"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
