[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "deepiri-speech"
version = "0.2.0"
description = "Deepiri speech — Poetry FastAPI with Pipecat + LiveKit always-on orchestration"
readme = "README.md"
license = "Apache-2.0"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.112.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }
pydantic = ">=2.8.0"
pydantic-settings = ">=2.2.0"
httpx = ">=0.27.0"
redis = { version = ">=5.0.0", extras = ["hiredis"] }
python-multipart = ">=0.0.9"
numpy = ">=1.24.0"
# Always-on orchestration (in-process — not separate services)
pipecat-ai = { version = ">=0.0.67", extras = ["websocket", "livekit"] }
livekit-api = ">=0.7.0"
livekit = ">=0.17.0"

# Heavy engines — poetry install -E engines | SPEECH_EXTRAS=engines|full
faster-whisper = { version = ">=1.1.0", optional = true }
kokoro-onnx = { version = ">=0.4.0", optional = true }
soundfile = { version = ">=0.12.0", optional = true }
onnxruntime = { version = ">=1.17.0", optional = true }
torch = { version = ">=2.2.0", optional = true }
livekit-agents = { version = ">=0.12.0", optional = true }
pywhispercpp = { version = ">=1.2.0", optional = true }

[tool.poetry.extras]
stt = ["faster-whisper"]
tts = ["kokoro-onnx", "soundfile", "onnxruntime"]
vad = ["torch"]
agents = ["livekit-agents"]
apple = ["pywhispercpp"]
# Production inference engines (+ Silero + LiveKit agents worker fallback)
engines = ["faster-whisper", "kokoro-onnx", "soundfile", "onnxruntime", "torch", "livekit-agents"]
# Alias used by Dockerfile SPEECH_EXTRAS=speech|1
speech = ["faster-whisper", "kokoro-onnx", "soundfile", "onnxruntime", "torch", "livekit-agents"]
full = [
  "faster-whisper",
  "kokoro-onnx",
  "soundfile",
  "onnxruntime",
  "torch",
  "livekit-agents",
  "pywhispercpp",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.8.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
